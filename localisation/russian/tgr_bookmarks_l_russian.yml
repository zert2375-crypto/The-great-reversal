l_russian:
 TGR_2000_NAME:0 "Великий Переворот: Мир без хозяев (2000)"
 TGR_2000_DESC:0 "1989 год принёс Берлинский Ядерный договор, а 1990 год — крах США. В январе 2000 года старые режимы теряют опору: в Аргентине читают книги Акта де Русо, в России растёт военное недовольство, а в Японии поднимается партия «Антарда»."
 ARG_TGR_2000_DESC:0 "Январь 2000 года. Нелюбимое народом демократическое правительство теряет контроль, а запрещённые книги Акта де Русо зажигают сердца миллионов. Аргентина стоит на пороге больших перемен."
 SOV_TGR_2000_DESC:0 "Абсолютная власть Алексея Меньшикова и партии «Союз» дала трещину после чистки трети вооружённых сил. Военная фракция недовольна, а на востоке растёт напряжённость."
 JAP_TGR_2000_DESC:0 "Политический хаос открывает путь к власти милитаристской партии «Антарда», обещающей порядок и сильную армию."
 SAG_TGR_2000_DESC:0 "Конфедерация Колумбии, Эквадора, Гайаны и Венесуэлы стремится защитить север Южной Америки и сохранить суверенитет."
 FRA_TGR_2000_DESC:0 "Глубокий раскол между богатым Западом и депрессивным Востоком подтачивает республику. Губернатор Востока Гаспар Примо ведёт собственную игру."
 ENG_TGR_2000_DESC:0 "Утратив опору за Атлантикой, Лондон ищет новый курс. Парламент, милитаристы и сторонники Содружества предлагают разные пути."
 GER_TGR_2000_DESC:0 "Столица Берлинского Ядерного договора и лидер Европейского объединения. Германия готовится защищать континент от внешних угроз."
 ITA_TGR_2000_DESC:0 "Итальянская Республика — участник Берлинского Ядерного договора и оплот Европейского объединения в южной Европе."
 OTHER_GATHERING_STORM_DESC:0 "Прочие суверенные государства и осколки прежней мировой системы, готовые вступить в водоворот XXI века."
