 TGR_2000_NAME:0 "Великий Переворот: Мир без хозяев (2000)"
 TGR_2000_DESC:0 "1989 год принёс Берлинский Ядерный договор, а 1990 год — крах США. В январе 2000 года рушатся старые режимы: в Аргентине читают книги Акта де Русо, в России зреет мятеж Михаила Черненко, а в Японии поднимается партия «Антарда»."
 ARG_TGR_2000_DESC:0 "Январь 2000 года. Нелюбимое народом демократическое правительство теряет контроль, а запрещенные книги Акта де Русо зажигают сердца миллионов. Впереди революция, покорение Южной Америки, два Красных пакта, Четырёхлетняя война, «План X» и судьбоносная Вторая революция 2038–2040 годов."
 SOV_TGR_2000_DESC:0 "Абсолютная власть Алексея Меньшикова и партии «Союз» дала трещину после чистки трети вооруженных сил. Милитарист Михаил Черненко готовит мятеж, в то время как на юге назревает война с Турцией, а на востоке поднимается агрессивная Антарда."
 JAP_TGR_2000_DESC:0 "Политический хаос 2000 года открывает путь к власти милитаристской партии «Антарда». Корея, Китай, восточная Россия, добровольцы в Уругвай и наконец сокрушительный удар по Азии в 2018 году, разжигающий Третью мировую войну."
 SAG_TGR_2000_DESC:0 "Конфедерация Колумбии, Эквадора, Гвинеи и Венесуэлы стремится защитить север Южной Америки. Союз с Аргенским Государством по Первому Красному пакту откроет путь в северную Бразилию — но ценой может стать собственный суверенитет."
 FRA_TGR_2000_DESC:0 "Глубокий раскол между богатым Западом и депрессивным Востоком подтачивает республику. Пока Париж игнорирует провинции, губернатор Востока Гаспар Примо ведёт собственную игру на фоне приближения аргенских сил к Пиренеям."
 ENG_TGR_2000_DESC:0 "Утратив опору за Атлантикой, Лондон ищет новый курс. Восхождение Нилона Армстронга, Второй Красный пакт с Аргенским Государством и борьба за Бенилюкс определят судьбу Европы и будущее Союзников в Третьей мировой войне."
 GER_TGR_2000_DESC:0 "Столица Берлинского Ядерного договора и лидер Европейского объединения. Союз восьми европейских стран готовится сдержать колониальную экспансию Аргенского Государства на континенте."
 ITA_TGR_2000_DESC:0 "Итальянская Республика — участник Берлинского Ядерного договора и оплот Европейского объединения в южной Европе. В условиях нарастающего геополитического давления Италии предстоит защищать демократические ценности и европейское единство."
 OTHER_GATHERING_STORM_DESC:0 "Прочие суверенные государства и осколки прежней мировой системы, готовые вступить в водоворот XXI века или пасть жертвами амбиций великих держав."
