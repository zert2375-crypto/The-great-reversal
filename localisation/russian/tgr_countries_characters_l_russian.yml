 # === Персонажи и лидеры ===
 ARG_democratic_president:0 "Фернандо де ла Пласа"
 ARG_democratic_president_desc:0 "Глава непопулярного демократического кабинета, не сумевшего справиться с последствиями мирового кризиса 1990-х и волной популярности трудов Акта де Русо."
 ARG_akt_de_ruso:0 "Акт де Русо"
 ARG_akt_de_ruso_desc:0 "Писатель, депортированный в Германию, но продолживший писать книги об идеальной нации «аргенов». Вернулся в июле 2000 года, возглавил революцию, воплотил «План Акта», заключил Первый и Второй Красные пакты и одержал победу в Четырёхлетней войне."
 ARG_celest_de_kuzo:0 "Селест де Кузо"
 ARG_celest_de_kuzo_desc:0 "Выдающийся стратег, ранее депортированный за симпатии к Акту. Помог России победить Турцию, возглавил модернизацию армии, принял власть после смерти Акта, курировал проект X-10 и «План X». Погиб в своей резиденции 26 мая 2040 года."
 ARG_rekt_de_avellenyo:0 "Рект де Авелленьо"
 ARG_rekt_de_avellenyo_desc:0 "Соратник Акта де Русо, возглавивший летом 2038 года Вторую Аргентинскую Революцию против жёсткой колониальной диктатуры Селеста. После мая 2040 года основал Аргенскую Федерацию, даровал колониям автономию и утвердил «План Охрана»."
 ARG_mateo_del_sur:0 "Матео дель Сур"
 ARG_mateo_del_sur_desc:0 "Главный координатор программы авианосца-верфи X-10, высадки «План X» и точечной воздушной операции во время Инцидента в Таиланде 2035 года."
 SOV_alexei_menshikov:0 "Алексей Меньшиков"
 SOV_alexei_menshikov_desc:0 "Участник месячных переговоров по Берлинскому соглашению 1989 года и основатель «кружка друзей Берлинского соглашения». В 1991 году привёл «Союз» к 56%, в 1996 — к 70% и закону о президентском единовластии. Бежал в Германию после мятежа 2000 года, вернувшись в Москву после Четырёхлетней войны."
 SOV_mikhail_chernenko:0 "Михаил Черненко"
 SOV_mikhail_chernenko_desc:0 "Главный антагонист Меньшикова среди военных. В 2000 году поднял мятеж, опираясь на уволенную треть армии и перешедшую на его сторону треть действующих частей, взял Кремль, разгромил Турцию с помощью Селеста и гарантировал малые страны Азии."
 SOV_viktor_gromov:0 "Виктор Громов"
 SOV_viktor_gromov_desc:0 "Командир армейской группировки, взаимодействовавший с аргенской миссией Селеста де Кузо в кампании против Турции."
 SOV_sergei_volkov:0 "Сергей Волков"
 SOV_sergei_volkov_desc:0 "Возглавлял оборону Сибири и Дальнего Востока против адаптивных дивизий Антарды в 2006–2010 годах."
 JAP_crisis_cabinet:0 "Чрезвычайный совет Токио"
 JAP_crisis_cabinet_desc:0 "Ослабленное правительство Японии, парализованное экономическим хаосом после краха США и ростом милитаристского движения «Антарда»."
 JAP_kenji_takahashi:0 "Кэндзи Такахаси"
 JAP_kenji_takahashi_desc:0 "Идеолог тотальной милитаризации и создатель государства Антарда. Провозгласил доктрину адаптивных дивизий, покорил Корею, Китай и восток России, отправил элитных добровольцев в Уругвай и начал наступление 2018 года."
 JAP_haruto_sato:0 "Харуто Сато"
 JAP_haruto_sato_desc:0 "Командир элитных добровольческих подразделений Антарды, обеспечивших победу Уругвая в 1-й Аргено-Уругвайской войне 2001 года."
 JAP_ren_nakamura:0 "Рэн Накамура"
 JAP_ren_nakamura_desc:0 "Глава послевоенного гражданского правительства, подписавшего акт о возвращении стране имени Япония после поражения Антарды в Третьей мировой войне."
 SAG_carlos_mendoza:0 "Карлос Мендоса"
 SAG_carlos_mendoza_desc:0 "Архитектор объединения Колумбии, Эквадора, Гвинеи и Венесуэлы в 2001 году и подписант Первого Красного пакта 15 сентября 2006 года в Буэнос-Айресе."
 SAG_luis_varona:0 "Луис Варона"
 SAG_luis_varona_desc:0 "Руководил северным наступлением САГ в ходе раздела Бразилии по Первому Красному пакту."
 FRA_laurent_moreau:0 "Лоран Моро"
 FRA_laurent_moreau_desc:0 "Представитель процветающего Запада Франции и участник дипломатических кругов Берлинского соглашения, проигнорировавший кризис восточных департаментов."
 FRA_gaspar_primo:0 "Гаспар Примо"
 FRA_gaspar_primo_desc:0 "Влиятельный и прагматичный наместник отсталого Востока. В 2013 году заключил сделку с Аргенским Государством: пропустил и разместил аргенские войска в обмен на власть над всей Францией."
 FRA_henri_valois:0 "Анри Валуа"
 FRA_henri_valois_desc:0 "Пытался организовать оборону южной границы после инцидента с аргенской разведкой под предлогом близости аэропорта (2011–2013)."
 ENG_arthur_pendleton:0 "Артур Пендлтон"
 ENG_arthur_pendleton_desc:0 "Руководитель парламентского кабинета, столкнувшийся с системным кризисом после распада США и ростом милитаристского подполья Нилона Армстронга."
 ENG_nilon_armstrong:0 "Нилон Армстронг"
 ENG_nilon_armstrong_desc:0 "Совершил революцию в Британии при поддержке аргенов; его режим продержался два года, однако политический авторитет Армстронга остался огромным. Его пламенная речь на 3-м Тетьенском съезде 2026 года ввела Аргенское Государство в Союзники против Антарды."
 ENG_edward_vance:0 "Эдвард Вэнс"
 ENG_edward_vance_desc:0 "Возглавил Британию после падения режима Армстронга, оформил Второй Красный пакт с Аргенским Государством и закрепил Бенилюкс за Лондоном."
 GER_klaus_weber:0 "Клаус Вебер"
 GER_klaus_weber_desc:0 "Возглавлял коалицию восьми европейских государств в Четырёхлетней войне 2016–2020 годов против аргенского наступления."
 ITA_marco_conti:0 "Марко Конти"
 ITA_marco_conti_desc:0 "Участник дипломатической группы Берлинского соглашения и союзник Германии по Европейскому объединению."
