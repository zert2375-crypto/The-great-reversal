 # === Персонажи и лидеры ===
 ARG_lucas_marchetti:0 "Лукас Маркетти"
 ARG_lucas_marchetti_desc:0 "Президент Аргентины от Демократической партии. Столкнулся с экономическим кризисом и ростом популярности идей Акта де Русо."
 ARG_akt_de_ruso:0 "Акт де Русо"
 ARG_akt_de_ruso_desc:0 "Писатель и идеолог аргенизма, автор книг об идеальной нации «аргенов». Вернулся из эмиграции и возглавил политическое движение за сильное государство."
 ARG_celest_de_kuzo:0 "Селест де Кузо"
 ARG_celest_de_kuzo_desc:0 "Фельдмаршал и сторонник Акта. Опытный стратег, выступающий за модернизацию армии и жёсткую дисциплину."
 ARG_rekt_de_avellenyo:0 "Рект де Авелленьо"
 ARG_rekt_de_avellenyo_desc:0 "Дипломат и соратник Акта, сторонник реформ и компромисса между центром и регионами."
 ARG_mateo_del_sur:0 "Матео дель Сур"
 ARG_mateo_del_sur_desc:0 "Офицер и организатор военных программ, отвечающий за флот и авиацию."
 SOV_boris_yeltsin:0 "Борис Ельцин"
 SOV_boris_yeltsin_desc:0 "Первый президент Российской Федерации. Его кабинет не смог сдержать рост влияния партии «Союз»."
 SOV_alexei_menshikov:0 "Алексей Меньшиков"
 SOV_alexei_menshikov_desc:0 "Лидер партии «Союз», бывший министр иностранных дел СССР. Сторонник сильной президентской власти и централизации."
 SOV_mikhail_chernenko:0 "Михаил Черненко"
 SOV_mikhail_chernenko_desc:0 "Генерал, лидер военной фракции. Требует восстановления армии и порядка, недоволен чистками и задержками финансирования."
 SOV_viktor_gromov:0 "Виктор Громов"
 SOV_viktor_gromov_desc:0 "Командир армейской группировки, сторонник мобильной войны и взаимодействия с союзниками."
 SOV_sergei_volkov:0 "Сергей Волков"
 SOV_sergei_volkov_desc:0 "Командир, отвечающий за оборону Сибири и Дальнего Востока."
 JAP_crisis_cabinet:0 "Чрезвычайный совет Токио"
 JAP_crisis_cabinet_desc:0 "Ослабленное правительство Японии, парализованное экономическим кризисом и ростом милитаристского движения."
 JAP_council_of_antarda:0 "Совет Антарды"
 JAP_council_of_antarda_desc:0 "Коллективный руководящий орган партии «Антарда», объединяющий военных и идеологов движения."
 JAP_kenji_takahashi:0 "Кэндзи Такахаси"
 JAP_kenji_takahashi_desc:0 "Идеолог тотальной милитаризации и лидер движения «Антарда». Сторонник сильной армии и экспансии."
 JAP_haruto_sato:0 "Харуто Сато"
 JAP_haruto_sato_desc:0 "Командир элитных добровольческих подразделений, специалист по экспедиционным операциям."
 JAP_ren_nakamura:0 "Рэн Накамура"
 JAP_ren_nakamura_desc:0 "Гражданский политик, сторонник мирного развития и ограничения военных расходов."
 SAG_carlos_mendoza:0 "Карлос Мендоса"
 SAG_carlos_mendoza_desc:0 "Архитектор объединения Колумбии, Эквадора, Гайаны и Венесуэлы в Соединённые Американские Государства."
 SAG_luis_varona:0 "Луис Варона"
 SAG_luis_varona_desc:0 "Военный командир САГ, отвечающий за северное направление."
 FRA_laurent_moreau:0 "Лоран Моро"
 FRA_laurent_moreau_desc:0 "Представитель процветающего Запада Франции, сторонник экономической стабильности."
 FRA_marc_delacroix:0 "Марк Делакруа"
 FRA_marc_delacroix_desc:0 "Глава администрации Западной Франции, сосредоточенный на развитии богатых регионов."
 FRA_gaspar_primo:0 "Гаспар Примо"
 FRA_gaspar_primo_desc:0 "Влиятельный наместник отсталого Востока, прагматичный политик, готовый к союзу с Аргентиной."
 FRA_henri_valois:0 "Анри Валуа"
 FRA_henri_valois_desc:0 "Французский командир, отвечающий за оборону южной границы."
 ENG_arthur_pendleton:0 "Артур Пендлтон"
 ENG_arthur_pendleton_desc:0 "Премьер-министр Великобритании, сторонник парламентской преемственности и прагматичной дипломатии."
 ENG_nilon_armstrong:0 "Нилон Армстронг"
 ENG_nilon_armstrong_desc:0 "Британский милитарист, лидер революционного движения, сторонник сильной армии и союза с Аргентиной."
 ENG_edward_vance:0 "Эдвард Вэнс"
 ENG_edward_vance_desc:0 "Британский политик, продолжающий прагматичный курс на сотрудничество с Аргентиной."
 GER_heinrich_von_berg:0 "Хайнрих фон Берг"
 GER_heinrich_von_berg_desc:0 "Канцлер Германии и лидер Европейского объединения, сторонник коллективной обороны Европы."
 GER_karl_weiss:0 "Карл Вайс"
 GER_karl_weiss_desc:0 "Наместник немецких земель, проводящий политику сотрудничества с Аргентиной."
 ITA_lorenzo_conti:0 "Лоренцо Конти"
 ITA_lorenzo_conti_desc:0 "Глава правительства Италии, участник дипломатической группы Берлинского соглашения, союзник Германии."
 # === Лидеры средних и малых держав ===
 POR_joao_ferreira_da_silva:0 "Жуан Феррейра да Силва"
 POR_joao_ferreira_da_silva_desc:0 "Премьер-министр Португалии, сторонник экономического сотрудничества с Аргентиной."
 SPA_rafael_morales:0 "Рафаэль Моралес"
 SPA_rafael_morales_desc:0 "Премьер-министр Испании, столкнувшийся с аргенской экспансией."
 HOL_willem_van_der_berg:0 "Виллем ван дер Берг"
 HOL_willem_van_der_berg_desc:0 "Глава Нидерландов и представитель Бенилюкса в Европейском объединении."
 BEL_luc_devaux:0 "Люк Дево"
 BEL_luc_devaux_desc:0 "Глава правительства Бельгии, сторонник нейтралитета и европейской интеграции."
 LUX_jean_paul_kirsch:0 "Жан-Поль Кирш"
 LUX_jean_paul_kirsch_desc:0 "Глава правительства Люксембурга, представляющий интересы великого герцогства."
 HUN_gabor_nagy:0 "Габор Надь"
 HUN_gabor_nagy_desc:0 "Премьер-министр Венгрии в составе Европейского объединения."
 CZE_tomash_novak:0 "Томаш Новак"
 CZE_tomash_novak_desc:0 "Глава Чехии и представитель чехословацкого направления в Европейском объединении."
 SLO_marek_kral:0 "Марек Краль"
 SLO_marek_kral_desc:0 "Глава правительства Словакии в составе Европейского объединения."
 SCA_sven_lindqvist:0 "Свен Линдквист"
 SCA_sven_lindqvist_desc:0 "Председатель Скандинавского оборонительного совета, сторонник коллективной безопасности."
 CHI_chen_weiming:0 "Чэнь Вэймин"
 CHI_chen_weiming_desc:0 "Глава правительства Китая, сторонник сопротивления внешней экспансии."
 KOR_park_song_hoo:0 "Пак Сонху"
 KOR_park_song_hoo_desc:0 "Командующий и лидер Кореи, сторонник независимости и обороны."
