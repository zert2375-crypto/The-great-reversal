 # === Персонажи и лидеры ===
 ARG_lucas_marchetti:0 "Лукас Маркетти"
 ARG_lucas_marchetti_desc:0 "Президент Аргентины от непопулярной Демократической партии. Не сумел справиться с последствиями краха США 1990 года и волной популярности книг Акта де Русо; в июле 2000 года передал власть революции аргенов."
 ARG_akt_de_ruso:0 "Акт де Русо"
 ARG_akt_de_ruso_desc:0 "Писатель, депортированный в Германию, но продолживший писать книги об идеальной нации «аргенов». Вернулся в июле 2000 года, возглавил революцию, воплотил «План Акта», заключил Первый и Второй Красные пакты и одержал победу в Четырёхлетней войне."
 ARG_celest_de_kuzo:0 "Селест де Кузо"
 ARG_celest_de_kuzo_desc:0 "Выдающийся стратег, ранее депортированный за симпатии к Акту. Помог России победить Турцию, возглавил модернизацию армии, принял власть после смерти Акта, курировал проект X-10 и «План X». Погиб в своей резиденции 26 мая 2040 года."
 ARG_rekt_de_avellenyo:0 "Рект де Авелленьо"
 ARG_rekt_de_avellenyo_desc:0 "Соратник Акта де Русо, возглавивший летом 2038 года Вторую Аргентинскую Революцию против жёсткой колониальной диктатуры Селеста. После мая 2040 года основал Аргенскую Федерацию, даровал колониям автономию и утвердил «План Охрана»."
 ARG_mateo_del_sur:0 "Матео дель Сур"
 ARG_mateo_del_sur_desc:0 "Главный координатор программы авианосца-верфи X-10, высадки «План X» и точечной воздушной операции во время Инцидента в Таиланде 2035 года."
 SOV_boris_yeltsin:0 "Борис Ельцин"
 SOV_boris_yeltsin_desc:0 "Первый президент Российской Федерации после распада СССР в 1991 году. Его кабинет не смог сдержать партию «Союз» и Алексея Меньшикова, который к 1996 году сосредоточил в своих руках всю полноту власти."
 SOV_alexei_menshikov:0 "Алексей Меньшиков"
 SOV_alexei_menshikov_desc:0 "Участник месячных переговоров по Берлинскому соглашению 1989 года и основатель «кружка друзей Берлинского соглашения». В 1991 году привёл «Союз» к 56%, в 1996 — к 70% и закону о президентском единовластии. Бежал в Германию после мятежа 2000 года, вернувшись в Москву после Четырёхлетней войны."
 SOV_mikhail_chernenko:0 "Михаил Черненко"
 SOV_mikhail_chernenko_desc:0 "Главный антагонист Меньшикова среди военных. В 2000 году поднял мятеж, опираясь на уволенную треть армии и перешедшую на его сторону треть действующих частей, взял Кремль, разгромил Турцию с помощью Селеста и гарантировал малые страны Азии."
 SOV_viktor_gromov:0 "Виктор Громов"
 SOV_viktor_gromov_desc:0 "Командир армейской группировки, взаимодействовавший с аргенской миссией Селеста де Кузо в кампании против Турции."
 SOV_sergei_volkov:0 "Сергей Волков"
 SOV_sergei_volkov_desc:0 "Возглавлял оборону Сибири и Дальнего Востока против адаптивных дивизий Антарды в 2006–2010 годах."
 JAP_crisis_cabinet:0 "Чрезвычайный совет Токио"
 JAP_crisis_cabinet_desc:0 "Ослабленное правительство Японии, парализованное экономическим хаосом после краха США и ростом милитаристского движения «Антарда»."
 JAP_council_of_antarda:0 "Совет Антарды"
 JAP_council_of_antarda_desc:0 "Коллективный руководящий орган партии и государства Антарда. Пришёл к власти в хаосе 2000 года, переименовал Японию в Антарду, направлял покорение Кореи, Китая и востока России и нёс ответственность за развязывание Третьей мировой войны 2018–2030 годов."
 JAP_kenji_takahashi:0 "Кэндзи Такахаси"
 JAP_kenji_takahashi_desc:0 "Идеолог тотальной милитаризации и создатель государства Антарда. Провозгласил доктрину адаптивных дивизий, покорил Корею, Китай и восток России, отправил элитных добровольцев в Уругвай и начал наступление 2018 года."
 JAP_haruto_sato:0 "Харуто Сато"
 JAP_haruto_sato_desc:0 "Командир элитных добровольческих подразделений Антарды, обеспечивших победу Уругвая в 1-й Аргено-Уругвайской войне 2001 года."
 JAP_ren_nakamura:0 "Рэн Накамура"
 JAP_ren_nakamura_desc:0 "Глава послевоенного гражданского правительства, подписавшего акт о возвращении стране имени Япония после поражения Антарды в Третьей мировой войне."
 SAG_carlos_mendoza:0 "Карлос Мендоса"
 SAG_carlos_mendoza_desc:0 "Архитектор объединения Колумбии, Эквадора, Гвинеи и Венесуэлы в 2001 году и подписант Первого Красного пакта 15 сентября 2006 года в Буэнос-Айресе."
 SAG_luis_varona:0 "Луис Варона"
 SAG_luis_varona_desc:0 "Руководил северным наступлением САГ в ходе раздела Бразилии по Первому Красному пакту."
 FRA_laurent_moreau:0 "Лоран Моро"
 FRA_laurent_moreau_desc:0 "Представитель процветающего Запада Франции и участник дипломатических кругов Берлинского соглашения, проигнорировавший кризис восточных департаментов."
 FRA_marc_delacroix:0 "Марк Делакруа"
 FRA_marc_delacroix_desc:0 "Глава администрации Западной Франции — процветающей части страны, которая до 2013 года предпочитала не замечать кризис восточных департаментов и угрозу со стороны Аргенского Государства."
 FRA_gaspar_primo:0 "Гаспар Примо"
 FRA_gaspar_primo_desc:0 "Влиятельный и прагматичный наместник отсталого Востока. В 2013 году заключил сделку с Аргенским Государством: пропустил и разместил аргенские войска в обмен на власть над всей Францией."
 FRA_henri_valois:0 "Анри Валуа"
 FRA_henri_valois_desc:0 "Пытался организовать оборону южной границы после инцидента с аргенской разведкой под предлогом близости аэропорта (2011–2013)."
 ENG_arthur_pendleton:0 "Артур Пендлтон"
 ENG_arthur_pendleton_desc:0 "Премьер-министр, сменивший режим Нилона Армстронга. В 2017 году подписал Второй Красный пакт с Аргенским Государством, по которому Великобритания получила Бенилюкс в обмен на союз против Антарды."
 ENG_nilon_armstrong:0 "Нилон Армстронг"
 ENG_nilon_armstrong_desc:0 "Совершил революцию в Британии при поддержке аргенов; его режим продержался два года, однако политический авторитет Армстронга остался огромным. Его пламенная речь на 3-м Тетьенском съезде 2026 года ввела Аргенское Государство в Союзники против Антарды."
 ENG_edward_vance:0 "Эдвард Вэнс"
 ENG_edward_vance_desc:0 "Британский политик, возглавивший кабинет после Артура Пендлтона. Продолжил проаргенский курс, закрепил Бенилюкс за Лондоном и обеспечил участие Британии в Третьей мировой войне на стороне Союзников."
 GER_heinrich_von_berg:0 "Хайнрих фон Берг"
 GER_heinrich_von_berg_desc:0 "Канцлер Германии и лидер Европейского объединения. Возглавлял коалицию восьми европейских государств в Четырёхлетней войне 2016–2020 годов против аргенского наступления."
 GER_karl_weiss:0 "Карл Вайс"
 GER_karl_weiss_desc:0 "Наместник немецких земель в составе Аргенского Государства после 2020 года. Проводил политику коллаборации с аргенами и обеспечивал поставки немецкой промышленности в общий рынок Федерации."
 ITA_lorenzo_conti:0 "Лоренцо Конти"
 ITA_lorenzo_conti_desc:0 "Глава правительства Италии и влиятельный участник дипломатической группы Берлинского соглашения. Союзник Германии по Европейскому объединению, занимавший пост премьер-министра в 2016–2020 годах."
 # === Лидеры средних и малых держав ===
 POR_joao_ferreira_da_silva:0 "Жуан Феррейра да Силва"
 POR_joao_ferreira_da_silva_desc:0 "Премьер-министр Португалии. В 2010 году подписал с Аргенским Государством договор о проходе аргенских войск через португальскую территорию в обмен на экономическую помощь и гарантии безопасности."
 SPA_rafael_morales:0 "Рафаэль Моралес"
 SPA_rafael_morales_desc:0 "Премьер-министр Испании в период Аргено-Испанской войны 2011 года. Не сумел остановить наступление аргенов и был вынужден принять условия победителя."
 HOL_willem_van_der_berg:0 "Виллем ван дер Берг"
 HOL_willem_van_der_berg_desc:0 "Глава Нидерландов и представитель стран Бенилюкса в Европейском объединении. До 2020 года отстаивал общие интересы Нидерландов, Бельгии и Люксембурга, пока регион не перешёл под контроль Британии."
 BEL_luc_devaux:0 "Люк Дево"
 BEL_luc_devaux_desc:0 "Глава правительства Бельгии в 2016–2020 годах. Вместе с другими странами Бенилюкса пытался сохранить нейтралитет, но после Второго Красного пакта Бельгия оказалась в британской сфере влияния."
 LUX_jean_paul_kirsch:0 "Жан-Поль Кирш"
 LUX_jean_paul_kirsch_desc:0 "Глава правительства Люксембурга в 2016–2020 годах. Представлял интересы великого герцогства в Европейском объединении и старался удержать страну вне большой войны."
 HUN_gabor_nagy:0 "Габор Надь"
 HUN_gabor_nagy_desc:0 "Премьер-министр Венгрии в составе Европейского объединения. В 2016–2020 годах руководил венгерской экономикой в условиях Четырёхлетней войны и мобилизации."
 CZE_tomash_novak:0 "Томаш Новак"
 CZE_tomash_novak_desc:0 "Глава Чехии и представитель чехословацкого направления в Европейском объединении. Опирался на промышленный потенциал страны, поставляя технику коалиции Германии."
 SLO_marek_kral:0 "Марек Краль"
 SLO_marek_kral_desc:0 "Глава правительства Словакии в составе Европейского объединения. Проводил осторожную политику, лавируя между Берлином и собственными национальными интересами."
 SCA_sven_lindqvist:0 "Свен Линдквист"
 SCA_sven_lindqvist_desc:0 "Председатель Скандинавского оборонительного совета. В Третьей мировой войне 2018–2030 годов выступил гарантом безопасности малых азиатских стран и координировал скандинавскую помощь их правительствам."
 CHI_chen_weiming:0 "Чэнь Вэймин"
 CHI_chen_weiming_desc:0 "Глава правительства Китая в период Китайской войны против Антарды 2003–2006 годов. Организовал сопротивление на континенте, но не смог предотвратить поражение и оккупацию восточных провинций."
 KOR_park_song_hoo:0 "Пак Сонху"
 KOR_park_song_hoo_desc:0 "Командующий и лидер Кореи в период Корейской войны против Антарды 2001–2002 годов. Его войска оказали упорное сопротивление, однако превосходство адаптивных дивизий Антарды решило исход кампании."
