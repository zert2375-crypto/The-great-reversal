l_russian:
 tgr_news.10.t:0 "Берлинский Ядерный договор 1989 года"
 tgr_news.10.d:0 "После затянувшихся на месяц напряжённых переговоров державы мира подписывают Берлинский Ядерный договор — строжайший запрет на разработку и обладание ядерным оружием для всех стран. В кулуарах формируется «кружок друзей Берлинского соглашения» с участием главы МИД СССР Алексея Меньшикова и дипломатов Франции, Италии и Великобритании."
 tgr_news.10.a:0 "Ядерная эпоха закрыта навсегда"
 tgr_news.11.t:0 "Крах Соединённых Штатов Америки"
 tgr_news.11.d:0 "Волна масштабного террора, захват крупнейших банков и государственных средств вооружёнными бандами обрушивают США. Десятки стран мира в одночасье теряют свои зарубежные активы. Старый биполярный порядок рушится: прежние мажоры слабеют, уступая сцену вчерашним минорам."
 tgr_news.11.a:0 "Мир остался без прежних хозяев"
 tgr_sov.1.t:0 "Триумф партии «Союз» и Закон о президентстве"
 tgr_sov.1.d:0 "После распада СССР партия «Союз» Алексея Меньшикова взяла 56% на выборах 1991 года благодаря обещаниям западных инвестиций, а в 1996 году получила 70% в Госдуме. Меньшиков проводит Закон о президентстве — единоличное право принимать или отклонять законы. Окружение молчит из страха, но милитарист Михаил Черненко открыто бросает ему вызов."
 tgr_sov.1.a:0 "Утвердить абсолютную власть Меньшикова"
 tgr_sov.1.b:0 "Пойти на компромисс с Госдумой и армией"
 tgr_arg.1.t:0 "Книги Акта де Русо из германского изгнания"
 tgr_arg.1.d:0 "Нелюбимая народом демократическая партия теряет контроль над страной. Тем временем запрещённые книги депортированного в Германию писателя Акта де Русо, описывающие идеальную нацию «аргенов» и государство-утопию, расходятся сотнями тысяч экземпляров."
 tgr_arg.1.a:0 "Слово Акта невозможно остановить цензурой"
 tgr_arg.2.t:0 "Июньские протесты в поддержку Акта"
 tgr_arg.2.d:0 "Стотысячные колонны с книгами Акта де Русо блокируют правительственный квартал Буэнос-Айреса. Демонстранты требуют немедленного возвращения писателя из Германии."
 tgr_arg.2.a:0 "Правительство вынуждено вернуть Акта в страну"
 tgr_arg.2.b:0 "Объявить чрезвычайное положение и разогнать площади"
 tgr_arg.3.t:0 "Июльская революция и капитуляция демократов"
 tgr_arg.3.d:0 "Акт де Русо создаёт партию и поднимает революцию. Демократическое правительство капитулирует, на карте рождается Аргенское Государство, а из изгнания возвращается фельдмаршал Селест де Кузо."
 tgr_arg.3.a:0 "Провозгласить Аргенское Государство и вернуть Селеста"
 tgr_news.1.t:0 "Мировая хроника: Рождение Аргенского Государства"
 tgr_news.1.d:0 "Из Буэнос-Айреса приходят сенсационные вести: писатель-изгнанник Акт де Русо принял капитуляцию демократов и провозгласил Аргенское Государство — воплощение нации «аргенов». Вместе с ним в столицу вернулся фельдмаршал Селест де Кузо."
 tgr_news.1.a:0 "Южная Америка меняется на наших глазах"
 tgr_sov.2.t:0 "Армейская чистка 2000 года"
 tgr_sov.2.d:0 "Увольнение трети армии и задержки финансирования личной гвардии ФСБ взрывают ситуацию. В казармах Урала и Сибири зреет недовольство; имя генерала Михаила Черненко всё чаще звучит в разговорах офицеров. Страна стоит на пороге открытого мятежа."
 tgr_sov.2.a:0 "Продолжить чистку"
 tgr_sov.2.b:0 "Смягчить курс"
 tgr_jap.1.t:0 "Победа партии «Антарда» в Японии"
 tgr_jap.1.d:0 "На волне хаоса 2000 года милитаристская партия «Антарда» свергает парализованный кабинет Токио и переименовывает государство в Антарду. Военные провозглашают стратегию адаптивных дивизий — создания уникальных частей под каждого противника."
 tgr_jap.1.a:0 "Да здравствует Антарда! Начать экспансию"
 tgr_jap.2.t:0 "Консолидация власти «Антарды»"
 tgr_jap.2.d:0 "Партия «Антарда» закрепляет контроль над Токио, реформирует армию и провозглашает курс на сильную милитаризованную Японию."
 tgr_jap.2.a:0 "Закрепить Корею и готовить удар по Китаю"
 tgr_jap.3.t:0 "Элитные добровольцы Антарды в Уругвае"
 tgr_jap.3.d:0 "С началом 1-й Аргено-Уругвайской войны Антарда перебрасывает к Монтевидео элитные адаптивные добровольческие части под командованием Харуто Сато, чтобы остановить аргенов."
 tgr_jap.3.a:0 "Отправить элитные части на помощь Уругваю"
 tgr_jap.3.b:0 "Не распылять силы перед Китайской войной"
 tgr_arg.4.t:0 "Горечь 1-й Уругвайской войны и стажировка генералов"
 tgr_arg.4.d:0 "Элитные добровольцы Антарды отбросили аргенские дивизии от Монтевидео. Акт де Русо и Селест де Кузо запускают программу обучения генералов в горячих точках планеты."
 tgr_arg.4.a:0 "Отправить Селеста де Кузо на помощь России против Турции"
 tgr_sov.3.t:0 "Победа России над Турцией с помощью Селеста де Кузо"
 tgr_sov.3.d:0 "Совместное планирование штаба Михаила Черненко и аргенского фельдмаршала Селеста де Кузо приносит России блестящую победу в кампании против Турции."
 tgr_sov.3.a:0 "Поблагодарить фельдмаршала Селеста за триумф"
 tgr_sov.4.t:0 "Прибытие аргенской военной миссии"
 tgr_sov.4.d:0 "Фельдмаршал Селест де Кузо и группа офицеров Аргенского Государства прибывают в расположение южных армий России для обмена тактическим опытом."
 tgr_sov.4.a:0 "Назначить Селеста старшим советником фронта"
 tgr_arg.5.t:0 "Победа во 2-й Аргено-Уругвайской войне (2004)"
 tgr_arg.5.d:0 "Закалённые в боях генералы возвращаются в Южную Америку. Во второй кампании против Уругвая аргенская армия действует безупречно и берёт Монтевидео, открывая дорогу к «Плану Акта»."
 tgr_arg.5.a:0 "Реванш свершён! Готовить «План Акта»"
 tgr_jap.4.t:0 "Победа Антарды в Китайской войне и удар по России"
 tgr_jap.4.d:0 "После трёх лет боёв Антарда завершает покорение Китая (2003–2006) и немедленно разворачивает зимние адаптивные корпуса на север — против России (2006–2010)."
 tgr_jap.4.a:0 "Китай наш — выступить на русский Восток"
 tgr_arg.6.t:0 "Первый Красный пакт в Буэнос-Айресе"
 tgr_arg.6.d:0 "Пока «План Акта» последовательно покоряет Чили, Парагвай, Боливию и Перу (2005–2007), Аргенское Государство и САГ подписывают 15 сентября 2006 года Первый Красный пакт о разделе Бразилии по линии север/юг. Всё южнее и включая Бразилиа отходит аргенам; в 2007 году Бразилиа переименована в Тетьен."
 tgr_arg.6.a:0 "Подписать Первый Красный пакт и разделить Бразилию"
 tgr_arg.6.b:0 "Отвергнуть пакт и защитить Бразилию"
 tgr_news.2.t:0 "Мировая хроника: Переименование Бразилиа в Тетьен"
 tgr_news.2.d:0 "Завершив «План Акта» (Чили, Парагвай, Боливия, Перу) и раздел Бразилии по Первому Красному пакту, Аргенское Государство торжественно переименовывает город Бразилиа в Тетьен."
 tgr_news.2.a:0 "Южная Америка обрела нового гегемона"
 tgr_sov.5.t:0 "Итог войны с Антардой: потеря и подчинение Востока"
 tgr_sov.5.d:0 "К 2010 году четырёхлетняя война с адаптивными дивизиями Антарды завершается тяжёлым ударом для России: восточные территории утрачены или подчинены Антарде. Москва клянётся вернуть Восток и начинает готовить азиатские гарантии."
 tgr_sov.5.a:0 "Мы вернёмся на Тихий океан — любой ценой"
 tgr_arg.7.t:0 "Вхождение САГ в состав Аргенского Государства (2010)"
 tgr_arg.7.d:0 "К 2010 году Соединённые Американские Государства оказываются в полной экономической и политической зависимости от Буэнос-Айреса и подписывают акт о вхождении в состав Аргенского Государства."
 tgr_arg.7.a:0 "САГ входит в состав Аргенского Государства"
 tgr_arg.7.b:0 "Сохранить статус автономии САГ"
 tgr_arg.8.t:0 "Договор с Португалией и Аргено-Испанская война"
 tgr_arg.8.d:0 "В 2010 году Португалия принимает аргенскую помощь в обмен на право прохода войск. Уже в 2011 году аргенские корпуса с португальского плацдарма одерживают убедительную победу в Аргено-Испанской войне."
 tgr_arg.8.a:0 "Закрепить Пиренейский плацдарм — впереди Франция"
 tgr_eur.1.t:0 "Разведка границы и рост напряжённости"
 tgr_eur.1.d:0 "Аргенские специалисты и авиация ведут разведку французских позиций под предлогом безопасности приграничного аэропорта. Париж поглощён делами Запада, а губернатор Востока Гаспар Примо ведёт собственную игру."
 tgr_eur.1.a:0 "Париж ограничивается дипломатической нотой"
 tgr_eur.2.t:0 "Аргено-Французская война и сделка с Гаспаром Примо"
 tgr_eur.2.d:0 "В 2013 году начинается Аргено-Французская война. Губернатор отсталой Восточной Франции Гаспар Примо заключает сделку с Актом де Русо: разрешает размещение аргенских войск на Востоке в обмен на пост губернатора всей Франции."
 tgr_eur.2.a:0 "Гаспар Примо принимает пост губернатора всей Франции"
 tgr_eur.2.b:0 "Арестовать Примо и сражаться до последнего"
 tgr_eur.3.t:0 "Революция Нилона Армстронга в Великобритании"
 tgr_eur.3.d:0 "При поддержке Аргенского Государства британский милитарист Нилон Армстронг совершает революцию в Лондоне. Британия берёт курс на милитаризацию и сближение с Аргентиной."
 tgr_eur.3.a:0 "Нилон Армстронг берёт власть (двухлетний режим)"
 tgr_news.3.t:0 "Начало Четырёхлетней войны с Европейским объединением"
 tgr_news.3.d:0 "Аргенское Государство вступает в великую войну против Европейского объединения (Германия, Италия, Венгрия, Нидерланды, Бельгия, Люксембург, Чехия, Словакия). Первый год проходит в тяжёлом медленном противостоянии, пока аргенские штабы готовят летнее наступление 2017 года."
 tgr_news.3.a:0 "Европа объята Четырёхлетней войной"
 tgr_eur.4.t:0 "Летнее наступление 2017 и Второй Красный пакт"
 tgr_eur.4.d:0 "С выходом новейшей аргенской авиации и бронетехники фронт Европейского объединения трещит по швам. Великобритания (после падения двухлетнего режима Армстронга) подписывает Второй Красный пакт с Аргенским Государством: Бенилюкс переходит Британии, Германия — в состав Аргенского Государства, остальные страны становятся марионетками."
 tgr_eur.4.a:0 "Подписать Второй Красный пакт (Бенилюкс — Британии)"
 tgr_eur.4.b:0 "Отклонить пакт и поддержать Европейское объединение"
 tgr_news.4.t:0 "Мировая хроника: Второй Красный пакт"
 tgr_news.4.d:0 "Буэнос-Айрес и Лондон объявили о подписании Второго Красного пакта. Судьба Европейского объединения предрешена."
 tgr_news.4.a:0 "Старая Европа пала"
 tgr_arg.9.t:0 "Смерть Акта де Русо и приход Селеста де Кузо"
 tgr_arg.9.d:0 "Вскоре после триумфального завершения Четырёхлетней войны уходит из жизни создатель Аргенского Государства Акт де Русо. Вся полнота власти переходит к фельдмаршалу Селесту де Кузо, который провозглашает курс на гражданское развитие и обустройство колоний, одновременно начиная секретную разработку авианосца-верфи X-10."
 tgr_arg.9.a:0 "Селест де Кузо принимает знамя Акта"
 tgr_sov.6.t:0 "Возвращение Алексея Меньшикова в Москву"
 tgr_sov.6.d:0 "После поражения Германии в Четырёхлетней войне бежавший туда в 2000 году Алексей Меньшиков возвращается в Москву. Его дипломатические таланты могут пригодиться России в бушующей Третьей мировой войне."
 tgr_sov.6.a:0 "Привлечь Меньшикова как дипломатического советника"
 tgr_sov.6.b:0 "Реабилитировать «Союз» и вернуть Меньшикову власть"
 tgr_jap.5.t:0 "Начало Третьей мировой войны (2018–2030)"
 tgr_jap.5.d:0 "Антарда наносит сокрушительный удар по малым странам Азии, независимость которых гарантируют Россия, Скандинавия, Ближний Восток и Океания. Вспыхивает глобальная Третья мировая война."
 tgr_jap.5.a:0 "Вся Азия падёт перед Антардой!"
 tgr_news.5.t:0 "Мировая хроника: Пламя Третьей мировой войны"
 tgr_news.5.d:0 "Гаранты малых стран Азии — Россия, Скандинавия, Ближний Восток и Океания — объявили войну Антарде. Главный вопрос десятилетия: чью сторону займёт могущественное Аргенское Государство?"
 tgr_news.5.a:0 "Мир вступил в решающую битву"
 tgr_arg.10.t:0 "3-й Тетьенский съезд и речь Нилона Армстронга"
 tgr_arg.10.d:0 "На 3-м Тетьенском съезде 2026 года с пламенной речью выступает британский милитарист Нилон Армстронг. Он призывает Селеста де Кузо не оставаться в стороне и бросить только что достроенный авианосец-верфь X-10 (2020–2025) в «План X» — морскую высадку против Антарды."
 tgr_arg.10.a:0 "Вступить в Союзники и активировать «План X»!"
 tgr_arg.10.b:0 "Сохранить вооружённый нейтралитет"
 tgr_news.6.t:0 "Мировая хроника: «План X» и гигант X-10 в Тихом океане"
 tgr_news.6.d:0 "После речи Нилона Армстронга на 3-м Тетьенском съезде флот Аргенского Государства во главе с уникальным авианосцем-верфью X-10 начинает грандиозную морскую высадку против Антарды."
 tgr_news.6.a:0 "Перелом в Третьей мировой войне!"
 tgr_jap.6.t:0 "Капитуляция Антарды и возвращение Японии"
 tgr_jap.6.d:0 "Совместный натиск Союзников и аргенского «Плана X» ломает военную машину Антарды. В 2030 году Третья мировая война окончена: Аргенское Государство получает новые колонии в Азии, а Антарда вновь становится Японией."
 tgr_jap.6.a:0 "Антарда пала — восстановить имя Японии"
 tgr_arg.11.t:0 "Инцидент в Таиланде (2035)"
 tgr_arg.11.d:0 "В ответ на кризис в Юго-Восточной Азии аргенская авиация наносит серию филигранных точечных ударов по военной промышленности и ключевым позициям Таиланда. Противник принуждён к капитуляции без единого сухопутного выстрела."
 tgr_arg.11.a:0 "Триумф доктрины точечного принуждения"
 tgr_news.7.t:0 "Мировая хроника: Бескровная капитуляция Таиланда"
 tgr_news.7.d:0 "Военные аналитики потрясены: аргенская авиация за считанные дни парализовала оборонный комплекс Таиланда точечными ударами, вынудив Бангкок сложить оружие без сухопутных боёв."
 tgr_news.7.a:0 "Новая эра воздушного господства"
 tgr_arg.12.t:0 "Колонии требуют свободы (2036)"
 tgr_arg.12.d:0 "Стабилизация мировой экономики лишает окраины прежнего страха перед хаосом: в европейских и азиатских колониях вспыхивают массовые волнения за свободу. Селест де Кузо отвечает жёстким подавлением и усилением эксплуатации."
 tgr_arg.12.a:0 "Подавить волнения силой и усилить эксплуатацию"
 tgr_arg.12.b:0 "Немедленно пойти на уступки и созвать федеральный совет"
 tgr_arg.13.t:0 "Вторая Аргентинская Революция и 26 мая 2040 года"
 tgr_arg.13.d:0 "Летом 2038 года бывший министр внутренних и внешних дел при Акте — Рект де Авелленьо — возглавляет Вторую Аргентинскую Революцию. После двух лет изнурительного позиционного тупика 26 мая 2040 года Селест де Кузо найден мёртвым в своей резиденции. Рождается Аргенская Федерация: колониям даруется широкая автономия (без полной независимости), и утверждается «План Охрана»."
 tgr_arg.13.a:0 "Провозгласить Аргенскую Федерацию и принять «План Охрана»"
 tgr_arg.13.b:0 "Охрана спасает Селеста — разгромить революцию силой"
 tgr_news.8.t:0 "Мировая хроника: Рождение Аргенской Федерации"
 tgr_news.8.d:0 "Смерть Селеста де Кузо 26 мая 2040 года положила конец двухлетнему позиционному тупику Второй Аргентинской Революции. Рект де Авелленьо провозгласил Аргенскую Федерацию, даровал колониям широкую автономию и утвердил доктрину «План Охрана»."
 tgr_news.8.a:0 "Так завершается сорокалетие Великого Переворота"
