l_russian:
 # === ARG — Аргентина → Аргенское Государство → Аргенская Федерация ===
 ARG_books_of_akt_de_ruso:0 "Книги Акта де Русо"
 ARG_books_of_akt_de_ruso_desc:0 "Депортированный в Германию писатель Акт де Русо не замолчал: его труды об идеальной нации «аргенов» и государстве-утопии тайно печатаются по всей Аргентине, подрывая авторитет нелюбимой демократической партии."
 ARG_june_2000_protests:0 "Июньские протесты 2000 года"
 ARG_june_2000_protests_desc:0 "Миллионы граждан выходят на площади Буэнос-Айреса, Кордовы и Росарио с требованием вернуть изгнанного писателя и распустить обанкротившийся демократический кабинет."
 ARG_return_of_akt_july_2000:0 "Возвращение Акта и создание партии"
 ARG_return_of_akt_july_2000_desc:0 "Под давлением улиц правительство вынуждено вернуть Акта де Русо из Германии. В июле 2000 года он учреждает партию аргенов и открыто провозглашает курс на революцию."
 ARG_capitulation_of_democrats:0 "Рождение Аргенского Государства"
 ARG_capitulation_of_democrats_desc:0 "Декабрь 2000 года: демократическая партия капитулирует. Провозглашается Аргенское Государство — воплощение государства-утопии «аргенов» со страниц книг Акта де Русо."
 ARG_return_celest_de_kuzo:0 "Возвращение Селеста де Кузо"
 ARG_return_celest_de_kuzo_desc:0 "Из изгнания торжественно возвращается фельдмаршал Селест де Кузо, ранее депортированный демократами за симпатии к идеям Акта. Он возглавляет Верховный штаб."
 ARG_year_of_civilian_reforms:0 "Год реформ: гражданская сфера"
 ARG_year_of_civilian_reforms_desc:0 "Первый этап преобразований 2000–2001 годов посвящён строительству «утопии»: модернизации школ, больниц, железных дорог и гражданской промышленности."
 ARG_utopian_living_standards:0 "Стандарты жизни аргенов"
 ARG_utopian_living_standards_desc:0 "Высокие социальные гарантии, жильё и бесплатное образование превращают Аргенское Государство в витрину благополучия, притягивающую симпатии даже будущих подчинённых народов."
 ARG_year_of_military_reforms:0 "Год реформ: военная сфера"
 ARG_year_of_military_reforms_desc:0 "После закладки гражданского фундамента Селест де Кузо начинает глубокую реформу армии, переводя её на современные штабные и промышленные рельсы."
 ARG_first_uruguayan_war:0 "1-я Аргено-Уругвайская война"
 ARG_first_uruguayan_war_desc:0 "Декабрь 2001 года: аргенская армия переходит реку Уругвай. Однако противник получает неожиданную поддержку элитных добровольцев Антарды, превращая кампанию в суровое испытание."
 ARG_lessons_of_uruguay:0 "Уроки поражения у Монтевидео"
 ARG_lessons_of_uruguay_desc:0 "Столкновение с адаптивной тактикой добровольцев Антарды показало нехватку боевого опыта у молодых генералов. Акт де Русо требует не карать, а учить командный состав."
 ARG_general_training_program:0 "Программа обучения генералов"
 ARG_general_training_program_desc:0 "Аргенское Государство рассылает своих военачальников в горячие точки мира для получения реального боевого опыта в масштабных операциях."
 ARG_celest_in_russo_turkish_war:0 "Миссия Селеста в России против Турции"
 ARG_celest_in_russo_turkish_war_desc:0 "Фельдмаршал Селест де Кузо лично возглавляет военную миссию при русском штабе Михаила Черненко, помогая России одержать решительную победу над Турцией."
 ARG_second_uruguayan_war:0 "2-я Аргено-Уругвайская война (2004)"
 ARG_second_uruguayan_war_desc:0 "Закалённые в горячих точках генералы возвращаются домой. В 2004 году Аргенское Государство наносит сокрушительный реваншистский удар и подчиняет Уругвай."
 ARG_plan_of_akt_south_america:0 "«План Акта»: покорение Южной Америки"
 ARG_plan_of_akt_south_america_desc:0 "Утверждается грандиозная стратегия объединения южноамериканского конуса в строгой последовательности: Чили, Парагвай, Боливия, Перу, а затем раздел Бразилии."
 ARG_plan_akt_chile:0 "Этап I: Операция в Чили"
 ARG_plan_akt_chile_desc:0 "Первый удар «Плана Акта» через Анды: выход к Тихому океану и установление контроля над чилийским побережьем."
 ARG_plan_akt_paraguay:0 "Этап II: Покорение Парагвая"
 ARG_plan_akt_paraguay_desc:0 "Молниеносный рывок вверх по Паране для включения Парагвая в промышленное и транспортное пространство Аргенского Государства."
 ARG_plan_akt_bolivia:0 "Этап III: Выход на Альтиплано (Боливия)"
 ARG_plan_akt_bolivia_desc:0 "Третий шаг «Плана Акта»: подчинение Боливии и получение доступа к богатым сырьевым месторождениям Анд."
 ARG_plan_akt_peru:0 "Этап IV: Завершение в Перу"
 ARG_plan_akt_peru_desc:0 "Финальный удар «Плана Акта» на западе континента: подчинение Перу и смыкание границ с союзной конфедерацией САГ."
 ARG_first_red_pact:0 "Первый Красный пакт (15 сентября 2006)"
 ARG_first_red_pact_desc:0 "В Буэнос-Айресе подписан исторический договор с Соединёнными Американскими Государствами о разделе Бразилии по линии север/юг: всё южнее и включая город Бразилиа отходит аргенам."
 ARG_rename_brasilia_to_tetyen:0 "Основание Тетьена (2007)"
 ARG_rename_brasilia_to_tetyen_desc:0 "После победы над Бразилией город Бразилиа официально переименован в Тетьен — новую стратегическую столицу континентальных съездов Аргенского Государства."
 ARG_integrate_sag_2010:0 "Подчинение и интеграция САГ (2010)"
 ARG_integrate_sag_2010_desc:0 "Попав в полную политическую и экономическую зависимость после раздела Бразилии, Соединённые Американские Государства в 2010 году входят в состав Аргенского Государства."
 ARG_portugal_access_treaty_2010:0 "Договор с Португалией (2010)"
 ARG_portugal_access_treaty_2010_desc:0 "Аргенское Государство предлагает Лиссабону масштабную помощь и защиту в обмен на право прохода войск и создание передового европейского плацдарма."
 ARG_argeno_spanish_war_2011:0 "Аргено-Испанская война (2011)"
 ARG_argeno_spanish_war_2011_desc:0 "Опираясь на португальский плацдарм, аргенские корпуса обрушиваются на Испанию, открывая эпоху колониальных завоеваний в Европе."
 ARG_french_airport_recon_2011:0 "Разведка границы Франции у аэропорта"
 ARG_french_airport_recon_2011_desc:0 "2011–2013 годы: под предлогом контроля воздушного пространства вблизи приграничного аэропорта аргенские штабисты вскрывают все укрепления и слабые места южной Франции."
 ARG_deal_with_gaspar_primo_2013:0 "Сделка с Гаспаром Примо и война с Францией"
 ARG_deal_with_gaspar_primo_2013_desc:0 "2013 год: тайный сговор с губернатором отсталой Восточной Франции Гаспаром Примо — размещение аргенских войск на Востоке в обмен на пост губернатора всей Франции."
 ARG_tech_leap_2014_2016:0 "Рывок в авиации, оружии и бронетехнике"
 ARG_tech_leap_2014_2016_desc:0 "2014–2016 годы: мобилизация конструкторских бюро перед столкновением с Европейским объединением. Создаются новейшие истребители, штурмовики, пехотное вооружение и тяжёлые танки."
 ARG_four_year_war_eu:0 "Четырёхлетняя война с Европейским объединением"
 ARG_four_year_war_eu_desc:0 "2016 год: столкновение с коалицией восьми держав (Германия, Италия, Венгрия, Бенилюкс, Чехия, Словакия). Медленный позиционный старт требует колоссального напряжения сил."
 ARG_summer_offensive_2017:0 "Летнее наступление 2017 года"
 ARG_summer_offensive_2017_desc:0 "Новейшие танки, авиация и перевооружённая пехота прорывают оборону Европейского объединения, ломая позиционный тупик первого года кампании."
 ARG_second_red_pact_uk:0 "Второй Красный пакт с Великобританией"
 ARG_second_red_pact_uk_desc:0 "Стратегическое соглашение с Лондоном: Великобритания вступает против Европейского объединения и получает Бенилюкс, а Германия переходит напрямую Аргенскому Государству."
 ARG_support_armstrong_uk:0 "Поддержка революции Нилона Армстронга"
 ARG_support_armstrong_uk_desc:0 "Буэнос-Айрес оказывает скрытую и прямую помощь британскому милитаристу Нилону Армстронгу, закладывая прочные личные связи на будущие десятилетия."
 ARG_new_european_order_2020:0 "Итоги Четырёхлетней войны (2020)"
 ARG_new_european_order_2020_desc:0 "Европейское объединение сокрушено. Германия входит в состав Аргенского Государства, Бенилюкс передан Британии, прочие страны становятся марионетками с высоким уровнем коллаборационизма."
 ARG_celest_takes_power:0 "Эпоха Селеста де Кузо"
 ARG_celest_takes_power_desc:0 "После смерти Акта де Русо верховную власть принимает его ближайший соратник фельдмаршал Селест де Кузо. Он провозглашает курс на гражданское развитие и обустройство колоний."
 ARG_colonial_civil_development:0 "Гражданское развитие колоний"
 ARG_colonial_civil_development_desc:0 "Крупные инвестиции в порты, железные дороги и переработку сырья в европейских и американских владениях закрепляют экономическое могущество державы."
 ARG_carrier_dockyard_x10:0 "Авианосец-верфь «X-10» (2020–2025)"
 ARG_carrier_dockyard_x10_desc:0 "Сверхсекретная пятилетняя программа создания плавучего гиганта-верфи X-10, способного хранить, обслуживать и ремонтировать целые флотские соединения прямо в Тихом океане."
 ARG_third_tetyen_congress_2026:0 "3-й Тетьенский съезд (2026)"
 ARG_third_tetyen_congress_2026_desc:0 "В Тетьене выступает британский милитарист Нилон Армстронг. Его историческая речь убеждает Селеста де Кузо вступить в Союзники против Антарды в Третьей мировой войне."
 ARG_plan_x_invasion_antarda:0 "«План X»: морская высадка против Антарды"
 ARG_plan_x_invasion_antarda_desc:0 "Авианосец-верфь X-10 выводит ударный флот к берегам Азии. Аргенская морская пехота наносит решающий удар в сердце Антарды, завершая Третью мировую войну."
 ARG_asian_colonies_and_japan_return:0 "Азиатские колонии и возврат Японии"
 ARG_asian_colonies_and_japan_return_desc:0 "Антарда повержена и вновь становится Японией. Аргенское Государство закрепляет за собой новые стратегические колонии и опорные базы в Азии."
 ARG_thailand_incident_2035:0 "Инцидент в Таиланде (2035)"
 ARG_thailand_incident_2035_desc:0 "Точечные воздушные удары по военной промышленности и позициям вынуждают Таиланд капитулировать без единого сухопутного выстрела — триумф аргенской авиационной мощи."
 ARG_colonial_unrest_2036:0 "Волнения в колониях (2036)"
 ARG_colonial_unrest_2036_desc:0 "Стабилизация мировой экономики пробуждает в колониях стремление к свободе. Селест де Кузо отвечает жёстким подавлением и усиленной эксплуатацией окраин."
 ARG_second_argentine_revolution_2038:0 "Вторая Аргентинская Революция (2038–2040)"
 ARG_second_argentine_revolution_2038_desc:0 "Лето 2038 года: бывший министр внутренних и внешних дел при Акте — Рект де Авелленьо — поднимает восстание против тирании Селеста. Страна входит в два года позиционного тупика."
 ARG_may_26_2040_federation:0 "26 мая 2040: Аргенская Федерация"
 ARG_may_26_2040_federation_desc:0 "26 мая 2040 года Селест де Кузо найден мёртвым в своей резиденции. Позиционный тупик окончен: Рект де Авелленьо провозглашает Аргенскую Федерацию."
 ARG_celest_iron_survival:0 "Альтернатива: Железная хватка Селеста"
 ARG_celest_iron_survival_desc:0 "Что если охрана резиденции 26 мая 2040 года сорвёт заговор? Селест де Кузо подавляет Вторую революцию и цементирует унитарную диктатуру силой."
 ARG_broad_colonial_autonomy:0 "Широкая автономия колоний"
 ARG_broad_colonial_autonomy_desc:0 "Аргенская Федерация дарует колониям широкое самоуправление, собственные парламенты и экономические права — сохраняя их в составе Федерации без полной независимости."
 ARG_plan_ohrana_directive:0 "Директива «План Охрана»"
 ARG_plan_ohrana_directive_desc:0 "Федерация отказывается от вмешательства в мелкие локальные споры, но закрепляет железный протокол: при начале нового глобального конфликта немедленно вторгнуться в Японию."
 ARG_pacific_guardian_fleets:0 "Флот сдерживания Тихого океана"
 ARG_pacific_guardian_fleets_desc:0 "Модернизация док-авианосцев серии X-10 и развёртывание передовых баз Федерации для гарантированного исполнения «Плана Охрана» в XXI веке."
 ARG_global_utopia_industrial_core:0 "Промышленное сердце Южного полушария"
 ARG_global_utopia_industrial_core_desc:0 "Соединение ресурсов Южной Америки, европейских технологий и азиатских морских путей превращает Федерацию в безусловный экономический центр мира."
 ARG_air_force_of_the_andes:0 "Авиационная школа Буэнос-Айреса"
 ARG_air_force_of_the_andes_desc:0 "Создание независимой школы дальней и штурмовой авиации — фундамент будущего технологического рывка 2014 года и доктрины точечных ударов."
 ARG_south_atlantic_shipyards:0 "Верфи Южной Атлантики"
 ARG_south_atlantic_shipyards_desc:0 "Расширение судостроительных мощностей для переброски экспедиционных корпусов в Европу и последующего проектирования класса X-10."
 # === SOV — Россия (Партия «Союз» / Военная Республика) ===
 SOV_legacy_of_soyuz_1991_1996:0 "Наследие партии «Союз» (1991–1996)"
 SOV_legacy_of_soyuz_1991_1996_desc:0 "После распада СССР партия Алексея Меньшикова взяла 56% в 1991 и 70% в 1996 году, опираясь на «кружок друзей Берлинского соглашения». Закон о президентстве дал ему абсолютную власть — но цена оказалась слишком высока."
 SOV_army_purge_and_fsb_guard:0 "Чистка армии и гвардия ФСБ"
 SOV_army_purge_and_fsb_guard_desc:0 "Меньшиков отправляет в отставку треть армии и переводит бюджет в ФСБ как личную гвардию, но задержки финансирования доводят офицерство до точки кипения."
 SOV_chernenko_uprising_2000:0 "Восстание Михаила Черненко (2000)"
 SOV_chernenko_uprising_2000_desc:0 "Генерал Михаил Черненко поднимает мятеж: к нему примыкают уволенная треть военных и ещё треть действующей армии. Через полгода Меньшиков разгромлен и бежит в Германию."
 SOV_menshikov_crushes_mutiny:0 "Альтернатива: Удар гвардии ФСБ"
 SOV_menshikov_crushes_mutiny_desc:0 "Меньшиков успевает погасить долги спецслужбам и наносит упреждающий удар по штабу Черненко, сохраняя президентское единовластие партии «Союз»."
 SOV_imprison_soyuz_traitors:0 "Суд над партией «Союз»"
 SOV_imprison_soyuz_traitors_desc:0 "Члены «Союза» отправляются в тюрьмы по обвинению в предательстве народа и развале армии. Конфискованные активы идут на возрождение оборонного комплекса."
 SOV_reintegrate_dismissed_officers:0 "Возвращение уволенной трети армии"
 SOV_reintegrate_dismissed_officers_desc:0 "Тысячи кадровых офицеров, отправленных Меньшиковым в отставку, с триумфом возвращаются в строй, восстанавливая боеспособность сухопутных округов."
 SOV_berlin_circle_investments:0 "Инвестиции кружка Берлинского соглашения"
 SOV_berlin_circle_investments_desc:0 "Используя личные связи с главами МИД Франции, Италии и Великобритании, Меньшиков привлекает масштабные европейские кредиты для модернизации заводов."
 SOV_fsb_state_vertical:0 "Государственная вертикаль безопасности"
 SOV_fsb_state_vertical_desc:0 "Консолидация аппарата ФСБ и гражданской бюрократии окончательно закрепляет режим Меньшикова и открывает путь к осторожной дипломатии в Евразии."
 SOV_invite_celest_military_mission:0 "Пригласить миссию Селеста де Кузо"
 SOV_invite_celest_military_mission_desc:0 "Кремль принимает аргенского фельдмаршала Селеста де Кузо в рамках программы стажировки генералов: его штабная школа готовит план разгрома турецкой группировки."
 SOV_russo_turkish_war:0 "Кампания против Турции"
 SOV_russo_turkish_war_desc:0 "Опираясь на реформированную армию и стратегические советы Селеста де Кузо, Россия наносит удар по Турции, утверждая своё господство в Причерноморье."
 SOV_ural_industrial_belt:0 "Уральский оборонный пояс"
 SOV_ural_industrial_belt_desc:0 "Ускоренное наращивание танковых и артиллерийских заводов в глубине страны перед неизбежным столкновением с Антардой на востоке."
 SOV_fortify_trans_siberian:0 "Укрепление Транссибирской магистрали"
 SOV_fortify_trans_siberian_desc:0 "После разгрома Китая Антардой Россия в спешке укрепляет дальневосточные рубежи и расширяет пропускную способность сибирских железных дорог."
 SOV_antardan_war_2006_2010:0 "Война с Антардой (2006–2010)"
 SOV_antardan_war_2006_2010_desc:0 "Адаптивные дивизии Антарды вторгаются в Сибирь и на Дальний Восток. Тяжёлая четырёхлетняя борьба решает судьбу восточных земель России."
 SOV_reorganize_after_eastern_loss:0 "Перегруппировка за Уралом"
 SOV_reorganize_after_eastern_loss_desc:0 "Даже утратив контроль над частью восточных регионов, Россия не смиряется и переводит экономику на долгосрочную подготовку к освобождению Азии."
 SOV_guarantees_to_asian_minors:0 "Гарантии малым странам Азии"
 SOV_guarantees_to_asian_minors_desc:0 "Вместе со Скандинавией, Ближним Востоком и Океанией Россия берёт под стратегический зонтик малые государства Азии, готовясь преградить путь новой агрессии Антарды."
 SOV_northern_and_middle_east_pact:0 "Связь со Скандинавией, Ближним Востоком и Океанией"
 SOV_northern_and_middle_east_pact_desc:0 "Координация штабов и поставок с северными, ближневосточными и тихоокеанскими гарантами создаёт единый антиантардский фронт."
 SOV_menshikov_returns_from_germany:0 "Возвращение Меньшикова из Германии"
 SOV_menshikov_returns_from_germany_desc:0 "После Четырёхлетней войны аргенов и падения старого порядка в Германии изгнанный Алексей Меньшиков возвращается в Москву — либо как советник примирения, либо как реваншист."
 SOV_reconcile_old_elites:0 "Дипломатическая амнистия и союз с Тетьеном"
 SOV_reconcile_old_elites_desc:0 "Опыт Меньшикова помогает Москве навести мосты с Аргенским Государством перед 3-м Тетьенским съездом 2026 года, ускоряя вступление аргенов в Союзники."
 SOV_ww3_total_mobilization:0 "Тотальная мобилизация Третьей мировой"
 SOV_ww3_total_mobilization_desc:0 "В ответ на удар Антарды 2018 года по малым странам Азии Россия разворачивает полномасштабное контрнаступление по всему евразийскому фронту."
 SOV_liberate_siberia_and_far_east:0 "Освобождение Востока и Тихоокеанский щит"
 SOV_liberate_siberia_and_far_east_desc:0 "Сокрушив восточный фронт Антарды одновременно с аргенским «Планом X», Россия возвращает Сибирь и Дальний Восток под контроль Москвы."
 SOV_arctic_air_shield:0 "Воздушный щит Евразии"
 SOV_arctic_air_shield_desc:0 "Массовое производство перехватчиков и зенитных комплексов нового поколения, нейтрализующее превосходство вражеской авиации на восточных равнинах."
 SOV_post_ww3_reconstruction:0 "Послевоенное возрождение России (2030–2040)"
 SOV_post_ww3_reconstruction_desc:0 "Победа в Третьей мировой войне позволяет перевести оборонный гигант в русло технологического развития, сохраняя паритет с Аргенской Федерацией."
 # === JAP — Антарда (Япония) ===
 JAP_chaos_of_2000:0 "Хаос 2000 года на островах"
 JAP_chaos_of_2000_desc:0 "После краха США и потери зарубежных активов японский парламент окончательно дискредитирован. На улицы Токио выходят колонны милитаристской партии «Антарда»."
 JAP_proclaim_antarda:0 "Победа партии и провозглашение Антарды"
 JAP_proclaim_antarda_desc:0 "Милитаристская партия «Антарда» берёт всю полноту власти и переименовывает государство. Старая Япония уходит в прошлое — рождается военная империя Антарда."
 JAP_adaptive_division_doctrine:0 "Стратегия адаптивных дивизий"
 JAP_adaptive_division_doctrine_desc:0 "Ключевое военное ноу-хау Антарды: отказ от шаблонных армий в пользу специализированных соединений, настроенных под рельеф и тактику каждого конкретного врага."
 JAP_military_industrial_forge:0 "Военная кузница метрополии"
 JAP_military_industrial_forge_desc:0 "Перевод индустриальных корпораций островов под единый штаб снабжения адаптивных корпусов и ударного флота."
 JAP_elite_volunteers_uruguay_2001:0 "Элитные добровольцы в Уругвай (2001)"
 JAP_elite_volunteers_uruguay_2001_desc:0 "Чтобы проверить адаптивные бригады в бою и сдержать амбиции молодого Аргенского Государства, Антарда отправляет элитных добровольцев на защиту Уругвая."
 JAP_korean_war_2001_2002:0 "Корейская война (2001–2002)"
 JAP_korean_war_2001_2002_desc:0 "Первый крупный континентальный поход Антарды: горно-штурмовые адаптивные дивизии сокрушают оборону Корейского полуострова."
 JAP_korean_industrial_base:0 "Корейский плацдарм снабжения"
 JAP_korean_industrial_base_desc:0 "Порты и железные дороги покорённой Кореи превращаются в тыловую базу для наступления на Китай."
 JAP_chinese_war_2003_2006:0 "Китайская война (2003–2006)"
 JAP_chinese_war_2003_2006_desc:0 "Трёхлетняя кампания по покорению Китая: механизированные и речные адаптивные группы рассекают крупнейшие провинции материка."
 JAP_assimilate_mainland_resources:0 "Мобилизация ресурсов материка"
 JAP_assimilate_mainland_resources_desc:0 "Сырьё и промышленные центры Китая питают стремительный рост сухопутных и морских армад Антарды."
 JAP_siberian_adaptive_corps:0 "Зимние адаптивные корпуса для Сибири"
 JAP_siberian_adaptive_corps_desc:0 "Специальная подготовка дивизий к экстремальным морозам, тайге и растянутым коммуникациям перед войной против России."
 JAP_russian_war_2006_2010:0 "Российская война (2006–2010)"
 JAP_russian_war_2006_2010_desc:0 "Четырёхлетний поход на север: Антарда сокрушает дальневосточную оборону России и подчиняет её восточные рубежи."
 JAP_subjugate_eastern_russia:0 "Подчинение Востока и триумф 2010 года"
 JAP_subjugate_eastern_russia_desc:0 "Закрепив контроль над Восточной Азией и Сибирью, Антарда становится бесспорным гегемоном Восточного полушария."
 JAP_pacific_fleet_expansion:0 "Океанский флот великого наступления"
 JAP_pacific_fleet_expansion_desc:0 "Строительство новых эскадр авианосцев и десантных кораблей для удара по Юго-Восточной Азии и отражения океанских угроз."
 JAP_air_supremacy_command:0 "Командование воздушного господства"
 JAP_air_supremacy_command_desc:0 "Насыщение фронтов Антарды штурмовой и истребительной авиацией перед решающим броском на юг Азии."
 JAP_strike_asian_minors_2018:0 "Удар по малым странам Азии (2018 — Начало 3-й мировой)"
 JAP_strike_asian_minors_2018_desc:0 "Антарда обрушивается на малые государства Азии, гарантируемые Россией, Скандинавией, Ближним Востоком и Океанией. Мир вспыхивает пламенем Третьей мировой войны."
 JAP_fortress_home_islands:0 "Оборона островов против «Плана X»"
 JAP_fortress_home_islands_desc:0 "После вступления Аргенского Государства на 3-м Тетьенском съезде 2026 года Антарда превращает побережье в неприступный бастион против флота X-10."
 JAP_final_adaptive_mobilization:0 "Последняя мобилизация Антарды"
 JAP_final_adaptive_mobilization_desc:0 "Все резервы империи брошены в бой ради удержания азиатского господства от сокрушительного натиска Союзников и аргенов."
 JAP_return_to_japan_status:0 "Возвращение к статусу Японии"
 JAP_return_to_japan_status_desc:0 "После поражения в Третьей мировой войне режим Антарды падает. Страна вновь принимает историческое имя Япония, вступая в напряжённый мир под тенью «Плана Охрана»."
 # === SAG — САГ (Соединённые Американские Государства) ===
 SAG_confederation_act_2001:0 "Акт о конфедерации САГ (2001)"
 SAG_confederation_act_2001_desc:0 "Колумбия, Эквадор, Гвинея и Венесуэла окончательно скрепляют союз, формируя Соединённые Американские Государства для защиты севера континента."
 SAG_andean_oil_and_industry:0 "Объединение нефтепромыслов и фабрик"
 SAG_andean_oil_and_industry_desc:0 "Интеграция ресурсов Венесуэлы и промышленных центров Колумбии создаёт прочную хозяйственную базу конфедерации."
 SAG_amazon_corps_command:0 "Амазонский корпус САГ"
 SAG_amazon_corps_command_desc:0 "Формирование джунглевых дивизий для действий на северных границах Бразилии."
 SAG_sign_first_red_pact_2006:0 "Подписать Первый Красный пакт (2006)"
 SAG_sign_first_red_pact_2006_desc:0 "15 сентября 2006 года в Буэнос-Айресе САГ подписывает с Аргенским Государством пакт о разделе Бразилии по линии север/юг."
 SAG_northern_brazil_campaign:0 "Занятие Северной Бразилии"
 SAG_northern_brazil_campaign_desc:0 "Корпуса САГ устанавливают контроль над северными штатами Бразилии, пока аргенские дивизии берут Бразилиа и юг."
 SAG_argen_economic_loans:0 "Аргенские кредиты и инфраструктура"
 SAG_argen_economic_loans_desc:0 "Для освоения новых земель Богота прибегает к масштабным субсидиям из Буэнос-Айреса и Тетьена, окончательно привязывая конфедерацию к южному гиганту."
 SAG_defy_buenos_aires:0 "Альтернатива: Разрыв зависимости"
 SAG_defy_buenos_aires_desc:0 "Конфедеративный совет отказывается подчиняться Буэнос-Айресу, готовя оборону Анд и Амазонии против аргенской аннексии."
 SAG_union_with_argen_state_2010:0 "Вхождение в состав Аргенского Государства (2010)"
 SAG_union_with_argen_state_2010_desc:0 "В 2010 году САГ подписывает акт о полном слиянии с Аргенским Государством, завершая объединение Южной Америки."
 SAG_fortify_northern_andes:0 "Крепость Северных Анд"
 SAG_fortify_northern_andes_desc:0 "Строительство линий обороны в горах Колумбии и Эквадора для сдерживания аргенского наступления."
 SAG_caribbean_naval_program:0 "Карибская морская программа"
 SAG_caribbean_naval_program_desc:0 "Расширение верфей Карибского побережья и торгового флота конфедерации."
 # === FRA — Франция (Запад / Губернаторство Гаспара Примо) ===
 FRA_two_frances_crisis:0 "Две Франции: Запад и Восток"
 FRA_two_frances_crisis_desc:0 "Страна расколота пополам: процветающий Запад диктует политику из Парижа, пока отсталый Восток копит глухое раздражение под управлением губернатора Гаспара Примо."
 FRA_western_industrial_privilege:0 "Привилегии развитого Запада"
 FRA_western_industrial_privilege_desc:0 "Правительство продолжает вкладывать ресурсы в Париж, Нормандию и Атлантику, ещё сильнее углубляя пропасть с Востоком."
 FRA_primo_eastern_domain:0 "Восточное губернаторство Гаспара Примо"
 FRA_primo_eastern_domain_desc:0 "Губернатор Востока Гаспар Примо консолидирует местную администрацию и силовиков, превращая восточные департаменты в собственную политическую вотчину."
 FRA_border_airport_incident_2011:0 "Инцидент с разведкой у аэропорта (2011–2013)"
 FRA_border_airport_incident_2011_desc:0 "После падения Испании аргенские самолёты и наблюдатели ведут открытую разведку французской границы под предлогом близости аэропорта."
 FRA_primo_secret_deal_2013:0 "Сделка Гаспара Примо с аргенами (2013)"
 FRA_primo_secret_deal_2013_desc:0 "В разгар Аргено-Французской войны Гаспар Примо открывает двери для размещения аргенских войск на Востоке в обмен на пост губернатора всей Франции."
 FRA_pyrenees_republican_stand:0 "Альтернатива: Оборона Пиренеев и арест Примо"
 FRA_pyrenees_republican_stand_desc:0 "Париж успевает сместить мятежного губернатора Востока и бросает все силы республики на укрепление пиренейской границы."
 FRA_rebuild_eastern_departments:0 "Индустриализация Восточной Франции"
 FRA_rebuild_eastern_departments_desc:0 "Став губернатором всей страны, Примо направляет ресурсы Запада и аргенские субсидии на подъём родного Востока."
 FRA_argen_garrison_logistics:0 "Плацдарм против Европейского объединения"
 FRA_argen_garrison_logistics_desc:0 "Французские аэродромы и железные дороги готовятся к переброске аргенских танковых армий на Рейн в 2016 году."
 FRA_join_european_union_bloc:0 "Союз с Европейским объединением"
 FRA_join_european_union_bloc_desc:0 "Республиканская Франция вступает в блок с Германией и Италией для совместного отражения аргенской экспансии."
 FRA_modernize_republican_army:0 "Перевооружение французской армии"
 FRA_modernize_republican_army_desc:0 "Закупка современной бронетехники и обновление доктрин для долгой европейской войны."
 # === ENG — Великобритания (Революция Армстронга и Второй Красный пакт) ===
 ENG_post_usa_collapse_reckoning:0 "Одиночество после краха США"
 ENG_post_usa_collapse_reckoning_desc:0 "Потеряв заокеанского союзника и активы в 1990 году, Британия ищет новую стратегию выживания в мире без прежних хозяев."
 ENG_rise_of_nilon_armstrong:0 "Революция Нилона Армстронга"
 ENG_rise_of_nilon_armstrong_desc:0 "При прямой поддержке Аргенского Государства британский милитарист Нилон Армстронг совершает переворот, ломая старую парламентскую апатию."
 ENG_two_year_militarist_rearm:0 "Двухлетняя программа перевооружения"
 ENG_two_year_militarist_rearm_desc:0 "За два года у власти режим Армстронга успевает в разы нарастить выпуск флота, авиации и десантных сил на Ла-Манше."
 ENG_fall_of_armstrong_regime:0 "Падение режима и возврат коалиции"
 ENG_fall_of_armstrong_regime_desc:0 "Спустя два года диктатура Армстронга падает, однако сам он сохраняет огромный вес в обществе, а новый кабинет продолжает прагматичный диалог с аргенами."
 ENG_second_red_pact_benelux:0 "Второй Красный пакт: Бенилюкс за Лондоном"
 ENG_second_red_pact_benelux_desc:0 "Великобритания заключает Второй Красный пакт с Аргенским Государством во время Четырёхлетней войны, обеспечивая себе контроль над Бенилюксом."
 ENG_integrate_benelux_ports:0 "Освоение портов Бенилюкса"
 ENG_integrate_benelux_ports_desc:0 "Роттердам и Антверпен соединяются с британской торговой сетью, возвращая Лондону статус первоклассной морской державы."
 ENG_armstrong_speech_tetyen_2026:0 "Речь Нилона Армстронга на 3-м Тетьенском съезде"
 ENG_armstrong_speech_tetyen_2026_desc:0 "2026 год: бывший диктатор Нилон Армстронг выступает с трибуны в Тетьене и убеждает Аргенское Государство вступить в Союзники против Антарды."
 ENG_royal_navy_pacific_taskforce:0 "Тихоокеанское соединение Королевского флота"
 ENG_royal_navy_pacific_taskforce_desc:0 "Совместные действия с авианосцем-верфью X-10 и флотом Океании в решающей фазе Третьей мировой войны."
 ENG_raf_long_range_strikes:0 "Дальняя авиация Королевских ВВС"
 ENG_raf_long_range_strikes_desc:0 "Модернизация стратегической и палубной авиации для операций в Индийском и Тихом океанах."
 ENG_north_sea_commonwealth_2030:0 "Североморское содружество (2030+)"
 ENG_north_sea_commonwealth_2030_desc:0 "Закрепление итогов Третьей мировой и стабильного партнёрства с Аргенской Федерацией и Россией."
 ARG_celest_returns_tt:0 "Фельдмаршал §YСелест де Кузо§! возвращается из изгнания и возглавляет аргенский генеральный штаб."
 ARG_plan_of_akt_threat:0 "Провозглашение «Плана Акта»"
 JAP_ww3_threat:0 "Удар Антарды по малым странам Азии"
