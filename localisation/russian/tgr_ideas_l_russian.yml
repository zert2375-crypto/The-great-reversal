l_russian:
 tgr_berlin_nuclear_treaty:0 "Берлинский Ядерный договор 1989 года"
 tgr_berlin_nuclear_treaty_desc:0 "Строгий международный запрет на разработку, испытания и хранение ядерного оружия для всех государств мира. Любая война ведётся исключительно конвенциональными средствами."
 tgr_post_usa_collapse_shock:0 "Эхо краха США 1990 года"
 tgr_post_usa_collapse_shock_desc:0 "Террор и разграбление американских банков в 1990 году уничтожили зарубежные активы десятков стран. Старые сверхдержавы ослаблены, открывая дорогу новым центрам силы."
 tgr_arg_unpopular_democrats:0 "Кризис демократического кабинета"
 tgr_arg_unpopular_democrats_desc:0 "Общество разочаровано неэффективностью правящей партии. Забастовки и уличные шествия парализуют государственный аппарат."
 tgr_arg_books_of_akt:0 "Книги Акта де Русо"
 tgr_arg_books_of_akt_desc:0 "Подпольные издания изгнанного в Германию писателя рисуют образ «аргенов» — идеальной сплочённой нации и государства-утопии, вдохновляя молодёжь и офицеров."
 tgr_arg_utopia_state:0 "Государство-утопия аргенов"
 tgr_arg_utopia_state_desc:0 "Идеология Акта де Русо превращает Аргенское Государство в образцовую систему социального подъёма, дисциплины и высокого уровня жизни, вызывающую восхищение даже на занятых территориях."
 tgr_arg_civilian_reforms:0 "Год гражданских реформ"
 tgr_arg_civilian_reforms_desc:0 "Первая фаза реформ 2000–2001 годов: масштабное обновление инфраструктуры, образования, здравоохранения и гражданской промышленности."
 tgr_arg_military_reforms:0 "Военная реформа Селеста де Кузо"
 tgr_arg_military_reforms_desc:0 "Вторая фаза реформ: перестройка армии по стандартам мобильной войны, штабная дисциплина и подготовка офицерского корпуса."
 tgr_arg_uruguay_humiliation:0 "Урок 1-й Уругвайской войны"
 tgr_arg_uruguay_humiliation_desc:0 "Неожиданное поражение от элитных добровольцев Антарды в декабре 2001 года заставило Буэнос-Айрес пересмотреть подготовку генералитета."
 tgr_arg_general_training_program:0 "Программа боевой стажировки генералов"
 tgr_arg_general_training_program_desc:0 "Командиры аргенов, включая Селеста де Кузо в российско-турецкой войне, проходят практику в горячих точках планеты, возвращаясь с бесценным опытом."
 tgr_arg_tech_leap_2014:0 "Технологический рывок 2014–2016"
 tgr_arg_tech_leap_2014_desc:0 "Комплексная программа новой авиации, стрелкового вооружения и бронетехники, подготовившая летнее наступление 2017 года против Европейского объединения."
 tgr_arg_european_collaboration:0 "Высокий уровень жизни и коллаборационизм"
 tgr_arg_european_collaboration_desc:0 "Европейские провинции, вошедшие в сферу Аргенского Государства, быстро интегрируются благодаря процветанию и социальным гарантиям метрополии."
 tgr_arg_carrier_dockyard_x10:0 "Авианосец-верфь «X-10»"
 tgr_arg_carrier_dockyard_x10_desc:0 "Уникальный мобильный гигант, разработанный в 2020–2025 годах для хранения, снабжения и ремонта ударных соединений прямо в океане — основа «Плана X»."
 tgr_arg_precision_strike_doctrine:0 "Доктрина точечного принуждения (Таиланд 2035)"
 tgr_arg_precision_strike_doctrine_desc:0 "Опыт инцидента в Таиланде доказал способность аргенской авиации выводить из строя военную промышленность врага и принуждать к капитуляции без единого сухопутного выстрела."
 tgr_arg_colonial_exploitation:0 "Жёсткая эксплуатация колоний (2036)"
 tgr_arg_colonial_exploitation_desc:0 "Подавив колониальные волнения силой, режим Селеста де Кузо выжимает ресурсы из окраин, что ускоряет рост подполья внутри самой метрополии."
 tgr_arg_federation_autonomy:0 "Широкая автономия Аргенской Федерации"
 tgr_arg_federation_autonomy_desc:0 "Реформа Ректа де Авелленьо после 26 мая 2040 года: колонии получают широкое самоуправление без полной независимости, навсегда снимая угрозу восстаний."
 tgr_arg_plan_ohrana:0 "Директива «План Охрана»"
 tgr_arg_plan_ohrana_desc:0 "Стратегическая доктрина Аргенской Федерации: игнорировать локальные конфликты, но при любом новом глобальном кризисе немедленно наносить превентивный удар по Японии."
 tgr_sov_soyuz_autocracy:0 "Закон о президентстве 1996 года"
 tgr_sov_soyuz_autocracy_desc:0 "Партия «Союз» Алексея Меньшикова взяла 70% в Госдуме и закрепила единоличное право президента принимать или отклонять любые законы. Окружение хранит молчание из страха."
 tgr_sov_army_purge_crisis:0 "Чистка армии и кризис ФСБ"
 tgr_sov_army_purge_crisis_desc:0 "Увольнение трети личного состава армии и перенаправление средств в личную гвардию ФСБ с задержками выплат поставили страну на грань военного восстания."
 tgr_sov_berlin_circle_ties:0 "Кружок друзей Берлинского соглашения"
 tgr_sov_berlin_circle_ties_desc:0 "Дипломатические связи Меньшикова с главами МИД Франции, Италии и Великобритании обеспечивают приток западных инвестиций."
 tgr_sov_chernenko_militarism:0 "Военная хунта Михаила Черненко"
 tgr_sov_chernenko_militarism_desc:0 "После разгрома Меньшикова в 2000 году армия вернула контроль над государством. Члены «Союза» осуждены за предательство, страна переведена на военные рельсы."
 tgr_sov_celest_mission:0 "Аргенская военная миссия Селеста де Кузо"
 tgr_sov_celest_mission_desc:0 "Прибытие фельдмаршала Селеста де Кузо и аргенских штабистов радикально усиливает наступательный потенциал России на турецком направлении."
 tgr_sov_eastern_wound:0 "Восточный реваншизм (после 2010)"
 tgr_sov_eastern_wound_desc:0 "Потеря и подчинение восточных рубежей Антарде в 2006–2010 годах сплотили Россию вокруг цели возврата Сибири и защиты малых стран Азии."
 tgr_jap_2000_chaos:0 "Японский хаос 2000 года"
 tgr_jap_2000_chaos_desc:0 "Обвал рынков после краха США и паралич парламента погрузили острова в волну беспорядков, прокладывая дорогу радикалам из партии «Антарда»."
 tgr_jap_antarda_ascendant:0 "Государство Антарда"
 tgr_jap_antarda_ascendant_desc:0 "Тотальная дисциплина и милитаристская мобилизация. Страна переименована в Антарду и нацелена на безраздельное господство в Азии."
 tgr_jap_adaptive_divisions:0 "Стратегия адаптивных дивизий"
 tgr_jap_adaptive_divisions_desc:0 "Уникальная военная школа Антарды: формирование узкоспециализированных соединений под рельеф, климат и тактику каждого конкретного противника — от гор Кореи до степей России."
 tgr_jap_elite_volunteers:0 "Элитные экспедиционные добровольцы"
 tgr_jap_elite_volunteers_desc:0 "Лучшие штурмовые бригады Антарды направляются в удалённые театры мира — включая Уругвай в 2001 году — для сдерживания соперников и обкатки доктрин."
 tgr_sag_confederation_charter:0 "Хартия конфедерации САГ (2001)"
 tgr_sag_confederation_charter_desc:0 "Союз Колумбии, Эквадора, Гвинеи и Венесуэлы объединяет север Южной Америки перед лицом мировой нестабильности."
 tgr_sag_argen_dependency:0 "Зависимость от Буэнос-Айреса"
 tgr_sag_argen_dependency_desc:0 "После Первого Красного пакта 2006 года экономика и дипломатия САГ всё теснее привязываются к Аргенскому Государству, приближая полную интеграцию 2010 года."
 tgr_fra_west_east_divide:0 "Контраст развитого Запада и отсталого Востока"
 tgr_fra_west_east_divide_desc:0 "Промышленный и финансовый блеск западных департаментов резко контрастирует с упадком Востока, которым управляет Гаспар Примо."
 tgr_fra_primo_deal_spirit:0 "Губернаторство Гаспара Примо"
 tgr_fra_primo_deal_spirit_desc:0 "По сделке 2013 года Примо предоставил аргенам базы и проход войск в обмен на власть над всей Францией и ресурсы для модернизации Востока."
 tgr_eng_post_atlantic_crisis:0 "Кризис после утраты Атлантики"
 tgr_eng_post_atlantic_crisis_desc:0 "Крах США лишил Лондон главного стратегического партнёра, подстегнув рост радикальных милитаристов во главе с Нилоном Армстронгом."
 tgr_eng_armstrong_legacy:0 "Наследие революции Нилона Армстронга"
 tgr_eng_armstrong_legacy_desc:0 "Несмотря на падение режима Армстронга спустя два года, созданная им военная промышленность и про-аргенские контакты определили дипломатию Лондона на десятилетия."
 tgr_eu_bloc_charter:0 "Договор Европейского объединения"
 tgr_eu_bloc_charter_desc:0 "Военно-политический союз Германии, Италии, Венгрии, Бенилюкса, Чехии и Словакии, созданный для коллективной обороны Европы после краха старого миропорядка."
