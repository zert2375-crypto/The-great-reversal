l_russian:
 tgr_berlin_nuclear_treaty:0 "Берлинский Ядерный договор 1989 года"
 tgr_berlin_nuclear_treaty_desc:0 "Строгий международный запрет на разработку, испытания и хранение ядерного оружия для всех государств мира. Любая война ведётся исключительно конвенциональными средствами."
 tgr_post_usa_collapse_shock:0 "Эхо краха США 1990 года"
 tgr_post_usa_collapse_shock_desc:0 "Террор и разграбление американских банков в 1990 году уничтожили зарубежные активы десятков стран. Старые сверхдержавы ослаблены, открывая дорогу новым центрам силы."
 tgr_arg_unpopular_democrats:0 "Кризис демократического кабинета"
 tgr_arg_unpopular_democrats_desc:0 "Общество разочаровано неэффективностью правящей партии. Забастовки и уличные шествия парализуют государственный аппарат."
 tgr_arg_books_of_akt:0 "Книги Акта де Русо"
 tgr_arg_books_of_akt_desc:0 "Подпольные издания изгнанного в Германию писателя рисуют образ «аргенов» — идеальной сплочённой нации и государства-утопии, вдохновляя молодёжь и офицеров."
 tgr_arg_utopia_state:0 "Государство-утопия аргенов"
 tgr_arg_utopia_state_desc:0 "Идеология Акта де Русо превращает Аргенское Государство в образцовую систему социального подъёма, дисциплины и высокого уровня жизни, вызывающую восхищение даже на занятых территориях."
 tgr_arg_civilian_reforms:0 "Год гражданских реформ"
 tgr_arg_civilian_reforms_desc:0 "Первая фаза реформ 2000–2001 годов: масштабное обновление инфраструктуры, образования, здравоохранения и гражданской промышленности."
 tgr_arg_military_reforms:0 "Военная реформа Селеста де Кузо"
 tgr_arg_military_reforms_desc:0 "Вторая фаза реформ: перестройка армии по стандартам мобильной войны, штабная дисциплина и подготовка офицерского корпуса."
 tgr_arg_uruguay_humiliation:0 "Урок 1-й Уругвайской войны"
 tgr_arg_uruguay_humiliation_desc:0 "Неожиданное поражение от элитных добровольцев Антарды в декабре 2001 года заставило Буэнос-Айрес пересмотреть подготовку генералитета."
 tgr_arg_general_training_program:0 "Программа боевой стажировки генералов"
 tgr_arg_general_training_program_desc:0 "Командиры аргенов, включая Селеста де Кузо в российско-турецкой войне, проходят практику в горячих точках планеты, возвращаясь с бесценным опытом."
 tgr_arg_tech_leap_2014:0 "Технологический рывок 2014–2016"
 tgr_arg_tech_leap_2014_desc:0 "Комплексная программа новой авиации, стрелкового вооружения и бронетехники, подготовившая летнее наступление 2017 года против Европейского объединения."
 tgr_arg_european_collaboration:0 "Высокий уровень жизни и коллаборационизм"
 tgr_arg_european_collaboration_desc:0 "Европейские провинции, вошедшие в сферу Аргенского Государства, быстро интегрируются благодаря процветанию и социальным гарантиям метрополии."
 tgr_arg_carrier_dockyard_x10:0 "Авианосец-верфь «X-10»"
 tgr_arg_carrier_dockyard_x10_desc:0 "Уникальный мобильный гигант, разработанный в 2020–2025 годах для хранения, снабжения и ремонта ударных соединений прямо в океане — основа «Плана X»."
 tgr_arg_precision_strike_doctrine:0 "Доктрина точечного принуждения (Таиланд 2035)"
 tgr_arg_precision_strike_doctrine_desc:0 "Опыт инцидента в Таиланде доказал способность аргенской авиации выводить из строя военную промышленность врага и принуждать к капитуляции без единого сухопутного выстрела."
 tgr_arg_colonial_exploitation:0 "Жёсткая эксплуатация колоний (2036)"
 tgr_arg_colonial_exploitation_desc:0 "Подавив колониальные волнения силой, режим Селеста де Кузо выжимает ресурсы из окраин, что ускоряет рост подполья внутри самой метрополии."
 tgr_arg_federation_autonomy:0 "Широкая автономия Аргенской Федерации"
 tgr_arg_federation_autonomy_desc:0 "Реформа Ректа де Авелленьо после 26 мая 2040 года: колонии получают широкое самоуправление без полной независимости, навсегда снимая угрозу восстаний."
 tgr_arg_plan_ohrana:0 "Директива «План Охрана»"
 tgr_arg_plan_ohrana_desc:0 "Стратегическая доктрина Аргенской Федерации: игнорировать локальные конфликты, но при любом новом глобальном кризисе немедленно наносить превентивный удар по Японии."
 tgr_sov_soyuz_autocracy:0 "Закон о президентстве 1996 года"
 tgr_sov_soyuz_autocracy_desc:0 "Партия «Союз» Алексея Меньшикова взяла 70% в Госдуме и закрепила единоличное право президента принимать или отклонять любые законы. Окружение хранит молчание из страха."
 tgr_sov_army_purge_crisis:0 "Чистка армии и кризис ФСБ"
 tgr_sov_army_purge_crisis_desc:0 "Увольнение трети личного состава армии и перенаправление средств в личную гвардию ФСБ с задержками выплат поставили страну на грань военного восстания."
 tgr_sov_berlin_circle_ties:0 "Кружок друзей Берлинского соглашения"
 tgr_sov_berlin_circle_ties_desc:0 "Дипломатические связи Меньшикова с главами МИД Франции, Италии и Великобритании обеспечивают приток западных инвестиций."
 tgr_sov_chernenko_militarism:0 "Военная хунта Михаила Черненко"
 tgr_sov_chernenko_militarism_desc:0 "После разгрома Меньшикова в 2000 году армия вернула контроль над государством. Члены «Союза» осуждены за предательство, страна переведена на военные рельсы."
 tgr_sov_celest_mission:0 "Аргенская военная миссия Селеста де Кузо"
 tgr_sov_celest_mission_desc:0 "Прибытие фельдмаршала Селеста де Кузо и аргенских штабистов радикально усиливает наступательный потенциал России на турецком направлении."
 tgr_sov_eastern_wound:0 "Восточный реваншизм (после 2010)"
 tgr_sov_eastern_wound_desc:0 "Потеря и подчинение восточных рубежей Антарде в 2006–2010 годах сплотили Россию вокруг цели возврата Сибири и защиты малых стран Азии."
 tgr_sov_fsb_prerogative:0 "Прерогатива ФСБ"
 tgr_sov_fsb_prerogative_desc:0 "Внутренние войска и спецслужбы получают право действовать автономно от армии, обеспечивая режиму Меньшикова защиту от заговоров и сепаратизма."
 tgr_sov_stavka_reborn:0 "Восстановленная Ставка"
 tgr_sov_stavka_reborn_desc:0 "Единый орган стратегического планирования координирует фронты, резервы и снабжение, возвращая армии чёткость управления."
 tgr_sov_officer_academy:0 "Военные академии нового образца"
 tgr_sov_officer_academy_desc:0 "Офицерский корпус проходит переподготовку по программам, основанным на опыте локальных войн и изучении вероятного противника."
 tgr_sov_state_propaganda:0 "Государственная пропаганда"
 tgr_sov_state_propaganda_desc:0 "Единая информационная машина формирует образ сильной России и врага, сплачивая общество вокруг власти."
 tgr_sov_church_concordat:0 "Конкордат с Церковью"
 tgr_sov_church_concordat_desc:0 "Соглашение с Православной церковью укрепляет моральный авторитет государства и расширяет поддержку мобилизации в деревне."
 tgr_sov_guided_democracy:0 "Управляемая демократия"
 tgr_sov_guided_democracy_desc:0 "Конституция 2008 года сохраняет видимость выборности, но закрепляет верховенство президентской власти и партии «Союз»."
 tgr_sov_consumer_recovery:0 "Восстановление потребительского рынка"
 tgr_sov_consumer_recovery_desc:0 "Рост лёгкой промышленности и насыщение рынка товарами народного потребления снижают социальную напряжённость."
 tgr_sov_eurasian_union:0 "Евразийский союз"
 tgr_sov_eurasian_union_desc:0 "Политическое и экономическое объединение пространства от Балтики до Тихого океана превращает Россию в равного партнёра новых мировых центров силы."
 tgr_jap_2000_chaos:0 "Японский хаос 2000 года"
 tgr_jap_2000_chaos_desc:0 "Обвал рынков после краха США и паралич парламента погрузили острова в волну беспорядков, прокладывая дорогу радикалам из партии «Антарда»."
 tgr_jap_antarda_ascendant:0 "Государство Антарда"
 tgr_jap_antarda_ascendant_desc:0 "Тотальная дисциплина и милитаристская мобилизация. Страна переименована в Антарду и нацелена на безраздельное господство в Азии."
 tgr_jap_adaptive_divisions:0 "Стратегия адаптивных дивизий"
 tgr_jap_adaptive_divisions_desc:0 "Уникальная военная школа Антарды: формирование узкоспециализированных соединений под рельеф, климат и тактику каждого конкретного противника — от гор Кореи до степей России."
 tgr_jap_elite_volunteers:0 "Элитные экспедиционные добровольцы"
 tgr_jap_elite_volunteers_desc:0 "Лучшие штурмовые бригады Антарды направляются в удалённые театры мира — включая Уругвай в 2001 году — для сдерживания соперников и обкатки доктрин."
 tgr_sag_confederation_charter:0 "Хартия конфедерации САГ (2001)"
 tgr_sag_confederation_charter_desc:0 "Союз Колумбии, Эквадора, Гвинеи и Венесуэлы объединяет север Южной Америки перед лицом мировой нестабильности."
 tgr_sag_argen_dependency:0 "Зависимость от внешнего кредитора"
 tgr_sag_argen_dependency_desc:0 "Экономика и дипломатия САГ всё теснее привязываются к внешним кредиторам."
 tgr_fra_west_east_divide:0 "Контраст развитого Запада и отсталого Востока"
 tgr_fra_west_east_divide_desc:0 "Промышленный и финансовый блеск западных департаментов резко контрастирует с упадком Востока, которым управляет Гаспар Примо."
 tgr_fra_primo_deal_spirit:0 "Губернаторство Гаспара Примо"
 tgr_fra_primo_deal_spirit_desc:0 "По сделке 2013 года Примо предоставил аргенам базы и проход войск в обмен на власть над всей Францией и ресурсы для модернизации Востока."
 tgr_eng_post_atlantic_crisis:0 "Кризис после утраты Атлантики"
 tgr_eng_post_atlantic_crisis_desc:0 "Крах США лишил Лондон главного стратегического партнёра, подстегнув рост радикальных милитаристов во главе с Нилоном Армстронгом."
 tgr_eng_armstrong_legacy:0 "Наследие революции Нилона Армстронга"
 tgr_eng_armstrong_legacy_desc:0 "Несмотря на падение режима Армстронга спустя два года, созданная им военная промышленность и про-аргенские контакты определили дипломатию Лондона на десятилетия."
 tgr_eu_bloc_charter:0 "Договор Европейского объединения"
 tgr_eu_bloc_charter_desc:0 "Военно-политический союз Германии, Италии, Венгрии, Бенилюкса, Чехии и Словакии, созданный для коллективной обороны Европы после краха старого миропорядка."
 # === GER — Германия ===
 tgr_ger_berlin_circle:0 "Кружок друзей Берлинского соглашения"
 tgr_ger_berlin_circle_desc:0 "Личные каналы германской дипломатии с Москвой, Парижем, Римом и Лондоном, сложившиеся на переговорах 1989 года. Они дают Берлину доступ к информации и влияние далеко за пределами его границ."
 tgr_ger_eu_leadership:0 "Германия во главе Европы"
 tgr_ger_eu_leadership_desc:0 "Экономическая мощь, промышленность и дипломатический аппарат делают Берлин бесспорным лидером Европейского объединения."
 tgr_ger_single_market:0 "Единый рынок объединения"
 tgr_ger_single_market_desc:0 "Общий рынок Германии, Италии, Венгрии и Бенилюкса ускоряет промышленную интеграцию и снижает издержки для германских корпораций."
 tgr_ger_mittelstand:0 "Опора Mittelstand"
 tgr_ger_mittelstand_desc:0 "Государственные гарантии и новые рынки для среднего бизнеса обеспечивают устойчивость германской экономики."
 tgr_ger_energy_transition:0 "Энергетическая независимость"
 tgr_ger_energy_transition_desc:0 "Развитие собственной энергетики и инфраструктуры снижает уязвимость Германии к внешним блокадам."
 tgr_ger_bundeswehr_reform:0 "Реформа Бундесвера"
 tgr_ger_bundeswehr_reform_desc:0 "Переход армии на мобильные штатные стандарты и повышение боевой подготовки превращают Бундесвер в главную сухопутную силу Западной Европы."
 tgr_ger_zeitenwende:0 "«Zeitenwende» 2014–2016"
 tgr_ger_zeitenwende_desc:0 "Крупнейшая программа перевооружения со времён холодной войны: новые танки, авиация, системы связи и расширение научных разработок."
 tgr_ger_argentina_watch:0 "Наблюдение за Аргентиной"
 tgr_ger_argentina_watch_desc:0 "БНД и военная разведка следят за аргенской армией и промышленностью, фиксируя рост угрозы на юге Атлантики."
 tgr_ger_four_year_war:0 "Четырёхлетняя война"
 tgr_ger_four_year_war_desc:0 "Германия переводит экономику и общество на военные рельсы. Промышленность наращивает выпуск вооружений, а пропаганда готовит население к затяжной войне."
 tgr_ger_abandoned_by_london:0 "Брошены Лондоном"
 tgr_ger_abandoned_by_london_desc:0 "Второй Красный пакт лишил Европейское объединение британской поддержки. Общество потрясено предательством, а армия лишилась западного фланга."
 tgr_ger_total_war_economy:0 "Экономика тотальной войны"
 tgr_ger_total_war_economy_desc:0 "Гражданская промышленность окончательно переведена на военные нужды. Заводы работают на пределе, но дефицит и усталость растут."
 tgr_ger_alpine_redoubt:0 "Альпийская цитадель"
 tgr_ger_alpine_redoubt_desc:0 "Остатки армии опираются на горные укрепления и склады, готовясь к последней обороне."
 tgr_ger_armistice_2020:0 "Перемирие 2020 года"
 tgr_ger_armistice_2020_desc:0 "Военное поражение и подписание перемирия. Германия теряет самостоятельность, а общество переживает глубокий моральный кризис."
 tgr_ger_weiss_governorate:0 "Губернаторство Карла Вайса"
 tgr_ger_weiss_governorate_desc:0 "Немецкие земли в составе Аргенского Государства. Наместник Вайс проводит политику сотрудничества, обеспечивая порядок и поставки промышленности."
 tgr_ger_underground_resistance:0 "Подпольное сопротивление"
 tgr_ger_underground_resistance_desc:0 "Тайные сети ветеранов и молодёжи сохраняют оружие, связи и идею независимой Германии."
 tgr_ger_tetyen_delegation:0 "Немецкая делегация в Тетьене"
 tgr_ger_tetyen_delegation_desc:0 "Представительство немецких земель в аргенской политической системе даёт ограниченное влияние на решения Буэнос-Айреса."
 tgr_ger_new_order_2030:0 "Новый европейский порядок"
 tgr_ger_new_order_2030_desc:0 "К 2030 году Германия встроена в аргенскую гегемонию. Экономика стабилизировалась, но социальная напряжённость сохраняется."
 tgr_ger_unrest_2036:0 "Волнения 2036 года"
 tgr_ger_unrest_2036_desc:0 "Забастовки и демонстрации в немецких землях показывают, что колониальная система трещит по швам."
 tgr_ger_federation_autonomy:0 "Автономия в Аргенской Федерации"
 tgr_ger_federation_autonomy_desc:0 "Широкая автономия немецких земель в составе Аргенской Федерации: самоуправление, восстановление экономики и прекращение жёсткой эксплуатации."
 tgr_ger_rhine_reconstruction:0 "Реконструкция Рейна"
 tgr_ger_rhine_reconstruction_desc:0 "Восстановление рейнских городов и заводов должно сгладить последствия войны и укрепить лояльность местных элит."
 tgr_ger_federal_army:0 "Федеральные вооружённые силы"
 tgr_ger_federal_army_desc:0 "Немецкие части в составе федеральной армии охраняют границы и порядок в интересах Аргенской Федерации."
 # === ITA — Италия ===
 tgr_ita_berlin_circle:0 "Итальянский круг Берлинского соглашения"
 tgr_ita_berlin_circle_desc:0 "Рим использует личные связи, сложившиеся на переговорах 1989 года, чтобы усилить своё влияние в европейской дипломатии."
 tgr_ita_conti_government:0 "Правительство Лоренцо Конти"
 tgr_ita_conti_government_desc:0 "Осторожная модернизация, лояльность Берлину и защита национальных интересов — курс итальянского правительства на десятилетия вперёд."
 tgr_ita_mediterranean_market:0 "Средиземноморский рынок"
 tgr_ita_mediterranean_market_desc:0 "Экономический союз с Германией и Бенилюксом превращает Средиземноморье в зону итальянской торговли и влияния."
 tgr_ita_northern_industry:0 "Промышленный Север"
 tgr_ita_northern_industry_desc:0 "Милан, Турин и Генуя становятся мотором итальянской экономики, обеспечивая занятость и экспорт."
 tgr_ita_southern_development:0 "Развитие Юга"
 tgr_ita_southern_development_desc:0 "Государственные программы сокращают разрыв между Севером и Югом и снижают социальную напряжённость."
 tgr_ita_tourism:0 "Туристическая держава"
 tgr_ita_tourism_desc:0 "Исторические центры, порты и железные дороги привлекают туристов и валюту, укрепляя мягкую силу Италии."
 tgr_ita_army_reform:0 "Реформа армии"
 tgr_ita_army_reform_desc:0 "Итальянская армия переходит на мобильные штатные стандарты и новые системы управления войсками."
 tgr_ita_navy_modernization:0 "Модернизация флота"
 tgr_ita_navy_modernization_desc:0 "Новые корабли и верфи позволяют Риму претендовать на контроль над центральным Средиземноморьем."
 tgr_ita_servizio:0 "Реформа спецслужб"
 tgr_ita_servizio_desc:0 "Итальянские спецслужбы объединяют усилия и начинают пристально следить за событиями в Южной Америке."
 tgr_ita_argentina_watch:0 "Наблюдение за Аргентиной"
 tgr_ita_argentina_watch_desc:0 "Итальянская разведка фиксирует рост аргенской армии, флота и военного производства, предупреждая Рим об угрозе."
 tgr_ita_rearmament:0 "Перевооружение 2014–2016"
 tgr_ita_rearmament_desc:0 "Италия присоединяется к германской программе перевооружения, получая новые системы вооружений и опыт совместных операций."
 tgr_ita_four_year_war:0 "Четырёхлетняя война"
 tgr_ita_four_year_war_desc:0 "Италия переводит экономику и общество на военные рельсы, готовясь к затяжному конфликту с Аргенским Государством."
 tgr_ita_total_war_economy:0 "Экономика тотальной войны"
 tgr_ita_total_war_economy_desc:0 "Гражданская промышленность окончательно переведена на военные нужды. Заводы работают на пределе, но дефицит и усталость растут."
 tgr_ita_abandoned_by_london:0 "Брошены Лондоном"
 tgr_ita_abandoned_by_london_desc:0 "Второй Красный пакт лишил Италию британской поддержки. Общество потрясено, а армия лишилась западного фланга."
 tgr_ita_alpine_redoubt:0 "Альпийская цитадель"
 tgr_ita_alpine_redoubt_desc:0 "Остатки итальянской армии опираются на горные укрепления и склады, готовясь к последней обороне."
 tgr_ita_armistice_2020:0 "Перемирие 2020 года"
 tgr_ita_armistice_2020_desc:0 "Военное поражение и подписание перемирия. Италия теряет самостоятельность и попадает в орбиту Аргенского Государства."
 tgr_ita_conti_governorate:0 "Губернаторство Конти"
 tgr_ita_conti_governorate_desc:0 "Италия становится марионеткой Аргенского Государства. Лоренцо Конти остаётся у власти в качестве губернатора."
 tgr_ita_underground_resistance:0 "Подпольное сопротивление"
 tgr_ita_underground_resistance_desc:0 "Ветераны и молодёжные группы сохраняют оружие и связи для будущего восстания против аргенской власти."
 tgr_ita_tetyen_delegation:0 "Итальянская делегация в Тетьене"
 tgr_ita_tetyen_delegation_desc:0 "Представительство Италии в аргенской политической системе даёт Риму ограниченное влияние на решения Буэнос-Айреса."
 tgr_ita_new_order_2030:0 "Новый порядок"
 tgr_ita_new_order_2030_desc:0 "К 2030 году Италия встроена в аргенскую гегемонию. Экономика стабилизировалась, но напряжение сохраняется."
 tgr_ita_unrest_2036:0 "Волнения 2036 года"
 tgr_ita_unrest_2036_desc:0 "Забастовки в итальянских городах показывают, что колониальная система теряет опору."
 tgr_ita_federation_autonomy:0 "Автономия в Аргенской Федерации"
 tgr_ita_federation_autonomy_desc:0 "Широкая автономия Италии в составе Аргенской Федерации: самоуправление, восстановление экономики и прекращение жёсткой эксплуатации."
 tgr_ita_reconstruction:0 "Реконструкция Италии"
 tgr_ita_reconstruction_desc:0 "Восстановление городов и заводов должно укрепить лояльность элит и снизить напряжение в промышленных районах."
 tgr_ita_federal_army:0 "Федеральные вооружённые силы"
 tgr_ita_federal_army_desc:0 "Итальянские части в составе федеральной армии охраняют границы и порядок в интересах Аргенской Федерации."
