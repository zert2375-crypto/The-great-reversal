l_russian:
 LOADING_TIP_0: "«Нация — это не земля и не кровь. Это воля к общему будущему.»\n- Акт де Русо"
 LOADING_TIP_1: "«Утопия не приходит сама. Её строят дисциплина и вера.»\n- Акт де Русо"
 LOADING_TIP_2: "«Свобода без порядка — это лишь другое имя хаоса.»\n- Акт де Русо"
 LOADING_TIP_3: "«Мы не покоряем народы. Мы приносим им порядок, который они потеряли.»\n- Акт де Русо"
 LOADING_TIP_4: "«История принадлежит тем, кто осмеливается её переписать.»\n- Акт де Русо"
 LOADING_TIP_5: "«Сильное государство начинается с сильной идеи.»\n- Акт де Русо"
 LOADING_TIP_6: "«Каждый арген — прежде всего гражданин, а потом уже человек.»\n- Акт де Русо"
 LOADING_TIP_7: "«Прошлое можно простить, но нельзя позволить ему управлять будущим.»\n- Акт де Русо"
 LOADING_TIP_8: "«Революция — это не бунт. Это рождение нового порядка.»\n- Акт де Русо"
 LOADING_TIP_9: "«Тот, кто боится перемен, уже проиграл будущему.»\n- Акт де Русо"
 LOADING_TIP_10: "«Единство — не в одинаковости, а в общей цели.»\n- Акт де Русо"
 LOADING_TIP_11: "«Мы строим государство, которое переживёт своих строителей.»\n- Акт де Русо"
 LOADING_TIP_12: "«Слово сильнее штыка, если за словом стоит воля.»\n- Акт де Русо"
 LOADING_TIP_13: "«Мир без хозяев — это мир, где каждый должен выбрать, кем он будет.»\n- Акт де Русо"
 LOADING_TIP_14: "«Не спрашивай, что страна сделала для тебя. Спроси, что ты готов отдать ей.»\n- Акт де Русо"
 LOADING_TIP_15: "«Армия — это не толпа с оружием. Это порядок, воплощённый в дисциплине.»\n- Селест де Кузо"
 LOADING_TIP_16: "«Побеждает не тот, у кого больше солдат, а тот, кто лучше понимает поле боя.»\n- Селест де Кузо"
 LOADING_TIP_17: "«Война не терпит импровизации. Она любит план и ненавидит самоуверенность.»\n- Селест де Кузо"
 LOADING_TIP_18: "«Генерал, который не бережёт солдата, не заслуживает армии.»\n- Селест де Кузо"
 LOADING_TIP_19: "«Сила без разума — это всего лишь насилие.»\n- Селест де Кузо"
 LOADING_TIP_20: "«Мы учимся у врага быстрее, чем он успевает понять, что мы учимся.»\n- Селест де Кузо"
 LOADING_TIP_21: "«Границы государства определяются не картами, а волей его армии.»\n- Селест де Кузо"
 LOADING_TIP_22: "«Лучшая оборона — это готовность к наступлению.»\n- Селест де Кузо"
 LOADING_TIP_23: "«Дисциплина — это уважение к общему делу.»\n- Селест де Кузо"
 LOADING_TIP_24: "«Я не верю в удачу. Я верю в подготовку.»\n- Селест де Кузо"
 LOADING_TIP_25: "«Армия должна служить государству, а не наоборот.»\n- Селест де Кузо"
 LOADING_TIP_26: "«Каждый бой — это урок. Проигравший платит за него кровью.»\n- Селест де Кузо"
 LOADING_TIP_27: "«Федерация — это не слабость. Это способ сохранить целое, не стирая различия.»\n- Рект де Авелленьо"
 LOADING_TIP_28: "«Автономия без уважения — это лишь отсрочка конфликта.»\n- Рект де Авелленьо"
 LOADING_TIP_29: "«Империя, которая не слышит своих окраин, обречена.»\n- Рект де Авелленьо"
 LOADING_TIP_30: "«Мир можно построить только на согласии, а не на страхе.»\n- Рект де Авелленьо"
 LOADING_TIP_31: "«Сильная власть должна уметь отпускать.»\n- Рект де Авелленьо"
 LOADING_TIP_32: "«Колониальная эксплуатация — это долг, который всегда возвращается.»\n- Рект де Авелленьо"
 LOADING_TIP_33: "«Единство народов начинается с признания их права на голос.»\n- Рект де Авелленьо"
 LOADING_TIP_34: "«Будущее Аргенской Федерации — в равноправии её частей.»\n- Рект де Авелленьо"
 LOADING_TIP_35: "«Власть — это не право. Это обязанность, которую немногие выдерживают.»\n- Алексей Меньшиков"
 LOADING_TIP_36: "«Демократия без дисциплины превращается в торг за будущее.»\n- Алексей Меньшиков"
 LOADING_TIP_37: "«Россия не может быть слабой. Слабая Россия — это война на её границах.»\n- Алексей Меньшиков"
 LOADING_TIP_38: "«Я не боюсь оппозиции. Я боюсь безразличия.»\n- Алексей Меньшиков"
 LOADING_TIP_39: "«Порядок — это не клетка. Это фундамент.»\n- Алексей Меньшиков"
 LOADING_TIP_40: "«Тот, кто контролирует информацию, контролирует будущее.»\n- Алексей Меньшиков"
 LOADING_TIP_41: "«Запад учит нас свободе, но забывает, что свобода требует силы.»\n- Алексей Меньшиков"
 LOADING_TIP_42: "«Государство — это корабль. Капитан не может советоваться с каждой волной.»\n- Алексей Меньшиков"
 LOADING_TIP_43: "«Я предпочитаю быть ненавидимым, но понятым.»\n- Алексей Меньшиков"
 LOADING_TIP_44: "«История не прощает тех, кто откладывает решения.»\n- Алексей Меньшиков"
 LOADING_TIP_45: "«Единство России — не в границах, а в воле её народа.»\n- Алексей Меньшиков"
 LOADING_TIP_46: "«Мы не отступаем. Мы перегруппировываемся.»\n- Алексей Меньшиков"
 LOADING_TIP_47: "«Армия — это последняя правда государства.»\n- Михаил Черненко"
 LOADING_TIP_48: "«Политики обещают. Солдаты выполняют.»\n- Михаил Черненко"
 LOADING_TIP_49: "«Мы не свергаем власть ради власти. Мы восстанавливаем порядок.»\n- Михаил Черненко"
 LOADING_TIP_50: "«Тот, кто предал армию, предал страну.»\n- Михаил Черненко"
 LOADING_TIP_51: "«Война начинается там, где заканчивается подготовка.»\n- Михаил Черненко"
 LOADING_TIP_52: "«Мы будем сражаться за Россию, даже если Россия не поймёт нас.»\n- Михаил Черненко"
 LOADING_TIP_53: "«Мир не уважает слабых. Он уважает только тех, кто готов защищаться.»\n- Михаил Черненко"
 LOADING_TIP_54: "«Ставка не обсуждает приказы. Ставка их исполняет.»\n- Михаил Черненко"
 LOADING_TIP_55: "«Россия начинается с дисциплины.»\n- Михаил Черненко"
 LOADING_TIP_56: "«Наши солдаты не спрашивают, почему. Они спрашивают, когда.»\n- Михаил Черненко"
 LOADING_TIP_57: "«Мы не ищем врагов. Мы готовимся к ним.»\n- Михаил Черненко"
 LOADING_TIP_58: "«Победа — это не чудо. Это результат воли.»\n- Михаил Черненко"
 LOADING_TIP_59: "«Британия не создана для того, чтобы ждать. Она создана для того, чтобы действовать.»\n- Нилон Армстронг"
 LOADING_TIP_60: "«Империя — это не прошлое. Это способ мыслить.»\n- Нилон Армстронг"
 LOADING_TIP_61: "«Парламент говорит. Флот действует.»\n- Нилон Армстронг"
 LOADING_TIP_62: "«Мы не отдадим Бенилюкс тем, кто не умеет его защищать.»\n- Нилон Армстронг"
 LOADING_TIP_63: "«Свобода без силы — это приглашение для тиранов.»\n- Нилон Армстронг"
 LOADING_TIP_64: "«Лондон снова станет центром мира.»\n- Нилон Армстронг"
 LOADING_TIP_65: "«Мы не боимся изоляции. Мы боимся бездействия.»\n- Нилон Армстронг"
 LOADING_TIP_66: "«Нация, которая не готова воевать, не готова жить.»\n- Нилон Армстронг"
 LOADING_TIP_67: "«Море принадлежит тем, кто его контролирует.»\n- Нилон Армстронг"
 LOADING_TIP_68: "«Старые союзы умерли. Пора строить новые.»\n- Нилон Армстронг"
 LOADING_TIP_69: "«Восток не должен платить за комфорт Запада.»\n- Гаспар Примо"
 LOADING_TIP_70: "«Политика — это искусство возможного. Я выбираю возможное.»\n- Гаспар Примо"
 LOADING_TIP_71: "«Париж слишком долго смотрел на Восток свысока.»\n- Гаспар Примо"
 LOADING_TIP_72: "«Сильный партнёр лучше слабого союзника.»\n- Гаспар Примо"
 LOADING_TIP_73: "«Франция едина только тогда, когда её слышат все.»\n- Гаспар Примо"
 LOADING_TIP_74: "«Я не предаю Францию. Я спасаю её от глупости.»\n- Гаспар Примо"
 LOADING_TIP_75: "«Власть — это инструмент. Важно, в чьих руках он находится.»\n- Гаспар Примо"
 LOADING_TIP_76: "«Мир начинается с признания реальности.»\n- Гаспар Примо"
 LOADING_TIP_77: "«Восточные департаменты заслуживают не жалости, а инвестиций.»\n- Гаспар Примо"
 LOADING_TIP_78: "«Мы не выбираем соседей. Мы выбираем, как с ними жить.»\n- Гаспар Примо"
 LOADING_TIP_79: "«Европа сильна только тогда, когда она едина.»\n- Хайнрих фон Берг"
 LOADING_TIP_80: "«Германия не может позволить себе быть островом.»\n- Хайнрих фон Берг"
 LOADING_TIP_81: "«Мир — это не отсутствие войны. Это способность её предотвратить.»\n- Хайнрих фон Берг"
 LOADING_TIP_82: "«Экономика — это продолжение политики другими средствами.»\n- Хайнрих фон Берг"
 LOADING_TIP_83: "«Мы не боимся конкуренции. Мы боимся изоляции.»\n- Хайнрих фон Берг"
 LOADING_TIP_84: "«Берлин должен быть не только столицей, но и центром доверия.»\n- Хайнрих фон Берг"
 LOADING_TIP_85: "«Европейское объединение — это не империя. Это общий дом.»\n- Хайнрих фон Берг"
 LOADING_TIP_86: "«Ответственность — цена лидерства.»\n- Хайнрих фон Берг"
 LOADING_TIP_87: "«Компромисс — не слабость, а инструмент.»\n- Хайнрих фон Берг"
 LOADING_TIP_88: "«Будущее Европы решается не на полях сражений, а в цехах и лабораториях.»\n- Хайнрих фон Берг"
 LOADING_TIP_89: "«Италия — мост между Европой и Средиземноморьем.»\n- Лоренцо Конти"
 LOADING_TIP_90: "«Стабильность — это не застой. Это уверенность в завтрашнем дне.»\n- Лоренцо Конти"
 LOADING_TIP_91: "«Мы не можем позволить себе роскошь быть слабыми.»\n- Лоренцо Конти"
 LOADING_TIP_92: "«Рим должен говорить с миром спокойно, но твёрдо.»\n- Лоренцо Конти"
 LOADING_TIP_93: "«Флот — это не роскошь. Это необходимость.»\n- Лоренцо Конти"
 LOADING_TIP_94: "«Север и Юг — не два народа, а одна страна.»\n- Лоренцо Конти"
 LOADING_TIP_95: "«Дипломатия начинается с уважения к себе.»\n- Лоренцо Конти"
 LOADING_TIP_96: "«Мы защищаем не только Италию, но и европейский порядок.»\n- Лоренцо Конти"
 LOADING_TIP_97: "«Япония не может ждать, пока мир решит её судьбу.»\n- Кэндзи Такахаси"
 LOADING_TIP_98: "«Адаптивность — это оружие сильнее любого танка.»\n- Кэндзи Такахаси"
 LOADING_TIP_99: "«Нация, которая не растёт, начинает умирать.»\n- Кэндзи Такахаси"
 LOADING_TIP_100: "«Мы не копируем врага. Мы превосходим его.»\n- Кэндзи Такахаси"
 LOADING_TIP_101: "«Армия должна быть столь же гибкой, как и море.»\n- Кэндзи Такахаси"
 LOADING_TIP_102: "«Восточная Азия должна принадлежать азиатам.»\n- Кэндзи Такахаси"
 LOADING_TIP_103: "«Мы не боимся войны. Мы боимся зависимости.»\n- Кэндзи Такахаси"
 LOADING_TIP_104: "«Каждый враг — это урок, каждый бой — экзамен.»\n- Кэндзи Такахаси"
 LOADING_TIP_105: "«Антарда — это не партия. Это судьба Японии.»\n- Кэндзи Такахаси"
 LOADING_TIP_106: "«Мир уважает только тех, кто готов на всё.»\n- Кэндзи Такахаси"
 LOADING_TIP_107: "«Мы не просим места под солнцем. Мы его берём.»\n- Кэндзи Такахаси"
 LOADING_TIP_108: "«Дисциплина и адаптация — две руки одной силы.»\n- Кэндзи Такахаси"
 LOADING_TIP_109: "«Конфедерация сильна не армией, а единством её народов.»\n- Карлос Мендоса"
 LOADING_TIP_110: "«Мы не позволим превратить Южную Америку в поле чужой игры.»\n- Карлос Мендоса"
 LOADING_TIP_111: "«Свобода начинается с контроля над собственными ресурсами.»\n- Карлос Мендоса"
 LOADING_TIP_112: "«Тот, кто не защищает свои границы, не имеет права называть их своими.»\n- Карлос Мендоса"
 LOADING_TIP_113: "«Мы не выбираем между Севером и Югом. Мы выбираем себя.»\n- Карлос Мендоса"
 LOADING_TIP_114: "«Сильный сосед — это не приговор. Это вызов.»\n- Карлос Мендоса"
 LOADING_TIP_115: "«Наше будущее — в единстве и трезвом расчёте.»\n- Карлос Мендоса"
 LOADING_TIP_116: "«Мы не боимся больших держав. Мы боимся собственной слабости.»\n- Карлос Мендоса"
 LOADING_TIP_117: "«Мир без хозяев — это мир, где каждый отвечает за себя.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_118: "«История не задаёт вопросов. Она ставит перед фактом.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_119: "«Нации приходят и уходят. Идеи остаются.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_120: "«Сила без идеи — это просто насилие.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_121: "«Война начинается с языка, на котором перестают говорить.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_122: "«Тот, кто контролирует прошлое, контролирует будущее.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_123: "«Границы — это не линии на карте, а договорённости между людьми.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_124: "«Мир не делится на добрых и злых. Он делится на готовых и неготовых.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_125: "«Каждое поколение считает, что живёт в конце истории.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_126: "«Свобода — это право выбирать, кому подчиняться.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_127: "«Порядок — это не отсутствие конфликта, а способ его ведения.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_128: "«Государство, которое не слышит улицу, слышит только выстрелы.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_129: "«Экономика — это кровь государства.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_130: "«Армия — это щит, а не меч. Но щит должен быть крепким.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_131: "«Дипломатия — это война, которую ведут словами.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_132: "«Нация, которая забыла свою историю, готова повторить её ошибки.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_133: "«Справедливость без силы — это мечта. Сила без справедливости — это тирания.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_134: "«Мы живём в эпоху, когда старые карты больше не работают.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_135: "«Тот, кто боится будущего, пытается остановить время.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_136: "«Единство — это не согласие во всём, а согласие в главном.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_137: "«Мир меняется не по плану. Он меняется по необходимости.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_138: "«Сила государства измеряется не армией, а доверием граждан.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_139: "«Нет ничего опаснее власти, которая не сомневается в себе.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_140: "«Каждая империя считает себя исключением из истории.»\n- Из архивов «Великого Переворота»"
 LOADING_TIP_141: "«Свобода и порядок — не враги. Враги — хаос и тирания.»\n- Из архивов «Великого Переворота»"
